# Timetrack local development environment (Colima / Docker Compose).
# Project name is fixed so volumes/networks never clash with other projects.
name: timetrack-dev

services:
  db:
    image: mariadb:12.3
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?run scripts/dev-env.sh init}
      MARIADB_DATABASE: ${DB_NAME:-timetrack}
      MARIADB_USER: ${DB_USER:-timetrack}
      MARIADB_PASSWORD: ${DB_PASSWORD:?run scripts/dev-env.sh init}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - timetrack-dev-db:/var/lib/mysql
    ports:
      - "${DB_BIND_ADDR:-127.0.0.1}:${DB_HOST_PORT:-13306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    image: timetrack-dev-backend:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &backend-env
      DATABASE_DRIVER: mariadb
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-timetrack}
      DB_USER: ${DB_USER:-timetrack}
      DB_PASSWORD: ${DB_PASSWORD:?run scripts/dev-env.sh init}
      DB_TLS: ${DB_TLS:-off}
      SQLITE_PATH: ${SQLITE_PATH:-/data/timetrack.sqlite}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Timetrack (dev)}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:18080}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:18080}
      APPLE_APP_IDS: ${APPLE_APP_IDS:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-336}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      PWA_STATIC_DIR: ${PWA_STATIC_DIR:-/srv/pwa}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_TLS: ${SMTP_TLS:-off}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.test}
      MODULES_DISABLED: ${MODULES_DISABLED:-}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      PUSH_ALLOWED_HOSTS: ${PUSH_ALLOWED_HOSTS:-}
      MAINTENANCE_INTERVAL_MINUTES: ${MAINTENANCE_INTERVAL_MINUTES:-60}
      MCP_AUDIT_RETENTION_DAYS: ${MCP_AUDIT_RETENTION_DAYS:-90}
      IMPORT_JOB_TIMEOUT_HOURS: ${IMPORT_JOB_TIMEOUT_HOURS:-168}
      STORAGE_ORPHAN_GRACE_HOURS: ${STORAGE_ORPHAN_GRACE_HOURS:-168}
    volumes:
      - ${PWA_STATIC_HOST_DIR:-./deploy/pwa-empty}:/srv/pwa:ro
    ports:
      - "${BACKEND_BIND_ADDR:-127.0.0.1}:${BACKEND_HOST_PORT:-18080}:8080"

  # SQLite single-instance mode: one replica only, never share the file between replicas.
  backend-sqlite:
    profiles: ["sqlite"]
    build:
      context: .
      dockerfile: Dockerfile
    image: timetrack-dev-backend:local
    restart: unless-stopped
    environment:
      <<: *backend-env
      DATABASE_DRIVER: sqlite
      SQLITE_PATH: /data/timetrack.sqlite
    volumes:
      - timetrack-dev-sqlite:/data
      - ${PWA_STATIC_HOST_DIR:-./deploy/pwa-empty}:/srv/pwa:ro
    ports:
      - "${BACKEND_BIND_ADDR:-127.0.0.1}:${BACKEND_HOST_PORT:-18080}:8080"

  mailpit:
    profiles: ["mail"]
    image: axllent/mailpit:v1.29
    restart: unless-stopped
    ports:
      - "${MAIL_BIND_ADDR:-127.0.0.1}:${MAIL_UI_HOST_PORT:-18025}:8025"
      # SMTP for host-run backends (SMTP_HOST=127.0.0.1, SMTP_PORT=11025, SMTP_TLS=off)
      - "${MAIL_BIND_ADDR:-127.0.0.1}:${MAIL_SMTP_HOST_PORT:-11025}:1025"

  # Adobe S3Mock: accepts any credentials, bucket created at start. Test double, not a real S3.
  s3mock:
    profiles: ["s3"]
    image: adobe/s3mock:5.2.3
    restart: unless-stopped
    # The image runs as uid 1000, a fresh named volume is root-owned; dev-only, so run as root.
    user: "0:0"
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET:-timetrack-dev}
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mock-data
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    volumes:
      - timetrack-dev-s3mock:/s3mock-data
    ports:
      - "${S3_BIND_ADDR:-127.0.0.1}:${S3_HTTP_HOST_PORT:-19090}:9090"
      - "${S3_BIND_ADDR:-127.0.0.1}:${S3_HTTPS_HOST_PORT:-19191}:9191"

  # Dex OIDC test provider (static users, public PKCE client). Config: deploy/dex/config.yaml
  dex:
    profiles: ["oidc"]
    image: dexidp/dex:v2.41.1
    restart: unless-stopped
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./deploy/dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "${OIDC_BIND_ADDR:-127.0.0.1}:${OIDC_HOST_PORT:-15556}:5556"

volumes:
  timetrack-dev-db:
    name: timetrack-dev-db
  timetrack-dev-sqlite:
    name: timetrack-dev-sqlite
  timetrack-dev-s3mock:
    name: timetrack-dev-s3mock
