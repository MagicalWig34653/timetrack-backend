# Release: on a tag v* run the full CI, then create a GitHub Release with generated notes, the OpenAPI contract
# a source bundle and the third-party notices. The container image for the same tag is built by docker.yml. Documentation: docs/CI.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: GitHub Release
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Source bundle and contract
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="timetrack-backend-${TAG}/" -o "dist/timetrack-backend-${TAG}-source.tar.gz" "$TAG"
          cp contracts/openapi.yaml "dist/openapi-${TAG}.yaml"
          # Licence texts of all SwiftPM pins (package L3). The container image carries the same file plus the OS packages.
          docker run --rm -v "$PWD:/w" -w /w swift:6.3-noble bash -c \
            'swift package resolve && scripts/third-party-notices.sh --swiftpm -o dist/THIRD-PARTY-NOTICES.txt'
          mv dist/THIRD-PARTY-NOTICES.txt "dist/THIRD-PARTY-NOTICES-${TAG}.txt"
          (cd dist && sha256sum ./* > SHA256SUMS)
      - name: Release notes header
        run: |
          cat > dist/notes.md <<NOTES
          Timetrack Backend ${TAG}, lizenziert unter AGPL-3.0-only.

          **Quellcode-Angebot (AGPL):** Der vollständige Quellcode dieser Version liegt als
          \`timetrack-backend-${TAG}-source.tar.gz\` bei und ist im Git-Tag \`${TAG}\` enthalten.
          Das Container-Image \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/timetrack-backend:${TAG#v}\` entsteht aus genau diesem Stand
          (Workflow Docker). API-Vertrag: \`openapi-${TAG}.yaml\`.
          Lizenztexte der Abhängigkeiten: \`THIRD-PARTY-NOTICES-${TAG}.txt\` (im Container-Image zusätzlich unter
          \`/usr/share/doc/timetrack/\`, dort inklusive der Betriebssystempakete).

          NOTES
      - name: Create the release
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --notes-file dist/notes.md "${flags[@]}" \
            "dist/timetrack-backend-${TAG}-source.tar.gz" "dist/openapi-${TAG}.yaml" "dist/THIRD-PARTY-NOTICES-${TAG}.txt" dist/SHA256SUMS
