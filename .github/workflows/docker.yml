# Container image: linux/amd64 and linux/arm64, built natively on matching runners, merged into one multi-arch tag.
# The PWA (repository timetrack-pwa, ref = variable PWA_REF; on a v* tag build the PWA tag of the same name; otherwise main) is built into the image.
# Pull requests build only (no push). main and tags v* are pushed to GHCR. Documentation: docs/CI.md.
name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "**.md"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Package.swift"
      - "Package.resolved"
      - "Sources/**"
      - "scripts/docker-entrypoint.sh"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/timetrack-backend

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            pair: linux-amd64
          # Native arm64 runner: avoids the slow and crash-prone QEMU emulation (see Dockerfile, QEMU_LIMIT).
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            pair: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Lower-case image name (registry names must be lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/timetrack-backend" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - name: Check out the PWA (built into the image)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/timetrack-pwa
          path: pwa-src
          ref: ${{ vars.PWA_REF || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'main' }}
      - name: Resolve the PWA revision
        id: pwa
        run: echo "sha=$(git -C pwa-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Resolve version and build date (shown in the app under Hilfe, ADR-0023)
        id: build_info
        env:
          PWA_REF: ${{ vars.PWA_REF || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'main' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"
          elif [ -n "$PR_NUMBER" ]; then version="pr-${PR_NUMBER}"
          else version="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"; fi
          {
            echo "version=${version}"
            echo "pwa_version=$(printf '%s' "${PWA_REF#v}" | tr -c 'A-Za-z0-9._-' '-')"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: pwa-src=./pwa-src
          build-args: |
            PWA_REVISION=${{ steps.pwa.outputs.sha }}
            PWA_VERSION=${{ steps.build_info.outputs.pwa_version }}
            APP_VERSION=${{ steps.build_info.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.build_info.outputs.date }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.pair }}
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  smoke-pr:
    # Pull requests do not push, so the amd64 image is rebuilt from the layer cache, loaded and started once.
    name: Smoke test (amd64, pull request)
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Lower-case image name (registry names must be lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/timetrack-backend" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - name: Check out the PWA (built into the image)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/timetrack-pwa
          path: pwa-src
          ref: ${{ vars.PWA_REF || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'main' }}
      - name: Resolve the PWA revision
        id: pwa
        run: echo "sha=$(git -C pwa-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Resolve version and build date (shown in the app under Hilfe, ADR-0023)
        id: build_info
        env:
          PWA_REF: ${{ vars.PWA_REF || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'main' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"
          elif [ -n "$PR_NUMBER" ]; then version="pr-${PR_NUMBER}"
          else version="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"; fi
          {
            echo "version=${version}"
            echo "pwa_version=$(printf '%s' "${PWA_REF#v}" | tr -c 'A-Za-z0-9._-' '-')"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build amd64 image into the local daemon
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: pwa-src=./pwa-src
          build-args: |
            PWA_REVISION=${{ steps.pwa.outputs.sha }}
            PWA_VERSION=${{ steps.build_info.outputs.pwa_version }}
            APP_VERSION=${{ steps.build_info.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.build_info.outputs.date }}
          platforms: linux/amd64
          load: true
          tags: timetrack-ci:smoke
          cache-from: type=gha,scope=linux-amd64
      - name: Start with SQLite and call /health
        env:
          EXPECT_PWA: "1"
          EXPECT_REVISION: ${{ github.sha }}
        run: scripts/ci-smoke.sh timetrack-ci:smoke

  merge:
    name: Publish multi-arch image
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Lower-case image name (registry names must be lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/timetrack-backend" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
      - name: Smoke test the published amd64 image
        env:
          EXPECT_PWA: "1"
          EXPECT_REVISION: ${{ github.sha }}
        run: scripts/ci-smoke.sh "${IMAGE}:${{ steps.meta.outputs.version }}"
