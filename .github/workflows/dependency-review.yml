# Blocks pull requests that add dependencies with known vulnerabilities. The license policy is documented in
# docs/LIZENZEN.md; AGPL-3.0-only is the project license, so no license deny list is enforced automatically here.
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
