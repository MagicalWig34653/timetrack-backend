# GitHub Pages: landing page and documentation (site/, VitePress) plus the API reference rendered from
# contracts/openapi.yaml. Repository setting required: Settings > Pages > Source = "GitHub Actions". Documentation: docs/CI.md.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "contracts/**"
      - "EINRICHTUNG.md"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "contracts/**"
      - "EINRICHTUNG.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Install
        working-directory: site
        run: npm ci
      - name: Build the site (copies docs, renders API reference)
        working-directory: site
        env:
          # Project pages live below /<repository>/.
          SITE_BASE: /${{ github.event.repository.name }}/
          SITE_REPO: ${{ github.repository }}
        run: npm run build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
