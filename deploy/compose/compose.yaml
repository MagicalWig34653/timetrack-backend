# Timetrack: simple production-style Docker Compose setup (single host). For a Swarm cluster use deploy/swarm/stack.yaml.
#
#   1. cp .env.example .env            and fill in the REQUIRED values (EVERYTHING is controlled by .env: every variable is passed
#                                      through, empty = not set, the backend decides per feature; <FEATURE>_ENABLED=true|false|empty)
#   2. ./init-secrets.sh               creates ./secrets/* (database password is read from the terminal)
#   3. docker compose up -d            runs the migration job first, then the backend
#      docker compose --profile db up -d   additionally starts a MariaDB container (single-host setups without a database)
# Documentation: docs/DEPLOYMENT.md (reverse proxy, passkeys, backups). Compose reads .env automatically.
name: timetrack

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  # One-shot schema migration. The backend never migrates (AUTO_MIGRATE=false) and reports /ready = 503 until the schema is current.
  migrate:
    image: ${TIMETRACK_IMAGE:?set TIMETRACK_IMAGE in .env}
    command: ["migrate", "--yes", "--env", "production"]
    restart: "no"
    environment:
      DATABASE_DRIVER: mariadb
      DB_HOST: ${DB_HOST:?set DB_HOST in .env}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-timetrack}
      DB_USER: ${DB_USER:-timetrack}
      DB_PASSWORD_FILE: /run/secrets/tt_db_password
      DB_TLS: ${DB_TLS:-required}
      AUTO_MIGRATE: "false"
    secrets: [tt_db_password]
    read_only: true
    tmpfs: [/tmp]
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
        required: false                       # only when the optional "db" profile is active

  backend:
    image: ${TIMETRACK_IMAGE:?set TIMETRACK_IMAGE in .env}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Published on the loopback interface by default (SEC-13): the backend speaks plain HTTP and must not be reachable from outside.
    # If the reverse proxy runs on ANOTHER host set BIND_ADDR to this host's private address (or 0.0.0.0) and firewall the port
    # so that ONLY the proxy can reach it; otherwise anybody can forge X-Forwarded-For (see TRUSTED_PROXY_CIDRS).
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PUBLISHED_PORT:-18080}:8080"
    environment:
      DATABASE_DRIVER: mariadb
      DB_HOST: ${DB_HOST:?set DB_HOST in .env}
      DB_PORT: "${DB_PORT:-3306}"
      DB_NAME: ${DB_NAME:-timetrack}
      DB_USER: ${DB_USER:-timetrack}
      DB_PASSWORD_FILE: /run/secrets/tt_db_password             # secret
      DB_TLS: ${DB_TLS:-required}                               # required (default) | off
      DB_POOL_CONNECTIONS_PER_LOOP: "${DB_POOL_CONNECTIONS_PER_LOOP:-1}"   # 1..8: connections per CPU core and replica
      DB_POOL_TIMEOUT_SECONDS: "${DB_POOL_TIMEOUT_SECONDS:-10}"            # 1..120: wait for a free connection
      DB_KEEPALIVE_SECONDS: "${DB_KEEPALIVE_SECONDS:-45}"       # 0 = off
      AUTO_MIGRATE: "false"                                     # fixed: migrations run in the migrate job only
      # ---- Public address and passkeys (the RP ID cannot be changed later without invalidating all passkeys) ----
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL (https://host)}      # REQUIRED, for example https://timetrack.example.test
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?set WEBAUTHN_RP_ID (public host name)}     # REQUIRED, lowercase host without scheme/port
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?set WEBAUTHN_ORIGIN (https://host)}      # REQUIRED, must equal the browser origin
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Timetrack}          # display name in the passkey dialog
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-336}"            # 1..8760 (the code default is 720, this stack uses 336 = 14 days)
      SESSION_IDLE_HOURS: "${SESSION_IDLE_HOURS:-336}"          # 1..8760: sessions unused for this long end earlier
      HSTS_MAX_AGE_SECONDS: "${HSTS_MAX_AGE_SECONDS:-15552000}" # 0 = no Strict-Transport-Security header (for example when the proxy sets it)
      # ---- Apple apps: apple-app-site-association (passkeys, universal links) ----
      APPLE_APP_IDS_ENABLED: "${APPLE_APP_IDS_ENABLED:-}"       # true | false | empty = on when APPLE_APP_IDS is set
      APPLE_APP_IDS: ${APPLE_APP_IDS:-}                         # <TeamID>.<BundleID>[,...]; empty = the endpoint answers 404
      # ---- Reverse proxy: networks that may report the client address (without it all clients share one rate-limit bucket) ----
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}             # REQUIRED behind a proxy (see the ports comment: firewall!)
      TRUSTED_PROXY_HEADER: ${TRUSTED_PROXY_HEADER:-X-Forwarded-For}   # X-Forwarded-For | X-Real-IP
      # ---- Emergency brake for the Content-Security-Policy of the PWA : enforce | report-only | off ----
      PWA_CSP_MODE: ${PWA_CSP_MODE:-enforce}                    # keep enforce unless the PWA does not start in a browser
      # ---- Files: S3 and local-path rules are set in the admin UI. S3 credentials are stored encrypted with this key ----
      STORAGE_SECRET_KEY_FILE: /run/secrets/tt_storage_secret_key      # secret
      STORAGE_S3_ALLOWED_HOSTS: ${STORAGE_S3_ALLOWED_HOSTS:-}   # optional hardening: exact S3 endpoint host names; empty = no restriction
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-}               # optional hardening: local paths must lie below this directory; empty = no restriction
      # ---- Web Push (VAPID) ----
      WEB_PUSH_ENABLED: "${WEB_PUSH_ENABLED:-}"                 # true | false | empty = on when key and subject are set
      VAPID_PRIVATE_KEY_FILE: /run/secrets/tt_vapid_private_key        # secret
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}                         # mailto: or https: contact URI, for example mailto:admin@example.test
      PUSH_ALLOWED_HOSTS: ${PUSH_ALLOWED_HOSTS:-}               # replaces the built-in push-service allow-list (ADR-0011); empty = built-in list
      NOTIFICATIONS_ENABLED: "${NOTIFICATIONS_ENABLED:-true}"   # background reminder runner
      # ---- APNs push for the Apple apps (ADR-0030); the key is the secret tt_apns_private_key (a placeholder = not set) ----
      APNS_ENABLED: "${APNS_ENABLED:-}"                         # true | false | empty = on when key, key ID, team ID and bundle IDs are set
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_IDS: ${APNS_BUNDLE_IDS:-}                     # comma separated, for example com.example.timetrack
      APNS_PRIVATE_KEY_FILE: /run/secrets/tt_apns_private_key   # secret
      # ---- E-mail (recovery codes); SMTP_PASSWORD is the secret tt_smtp_password (a placeholder = not set) ----
      SMTP_ENABLED: "${SMTP_ENABLED:-}"                         # true | false | empty = on when SMTP_HOST is set
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_TLS: ${SMTP_TLS:-starttls}                           # starttls | implicit ("off" only for loopback test hosts)
      SMTP_FROM: ${SMTP_FROM:-}                                 # required once SMTP_HOST is set
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Timetrack}
      SMTP_USER: ${SMTP_USER:-}                                 # with authentication: SMTP_USER AND the secret tt_smtp_password (real password)
      SMTP_PASSWORD_FILE: /run/secrets/tt_smtp_password         # secret
      # ---- OpenID Connect login; the client secret is the secret tt_oidc_client_secret (a placeholder = no client secret) ----
      OIDC_ENABLED: "${OIDC_ENABLED:-}"                         # true | false | empty = on when OIDC_ISSUER and OIDC_CLIENT_ID are set
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_NAME: ${OIDC_NAME:-OpenID Connect}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_CLIENT_SECRET_FILE: /run/secrets/tt_oidc_client_secret      # secret
      # ---- Modules and maintenance ----
      MODULES_DISABLED: ${MODULES_DISABLED:-}                   # reports,planning,transfer,automation,mcp,groups
      MAINTENANCE_INTERVAL_MINUTES: "${MAINTENANCE_INTERVAL_MINUTES:-60}"   # 0 = off (0..10080)
      MCP_AUDIT_RETENTION_DAYS: "${MCP_AUDIT_RETENTION_DAYS:-90}"           # 1..3650
      GROUPS_RETENTION_DAYS: "${GROUPS_RETENTION_DAYS:-90}"                 # 1..3650
      IMPORT_JOB_TIMEOUT_HOURS: "${IMPORT_JOB_TIMEOUT_HOURS:-168}"          # 1..8760
      STORAGE_ORPHAN_GRACE_HOURS: "${STORAGE_ORPHAN_GRACE_HOURS:-168}"      # 1..8760
      LOG_TIMESTAMPS: "${LOG_TIMESTAMPS:-true}"                 # UTC timestamp at the start of every log line (false = off)
      PWA_STATIC_DIR: /srv/pwa                                  # fixed: the PWA is part of the image
    secrets:
      - tt_db_password
      - tt_storage_secret_key
      - tt_vapid_private_key
      - tt_smtp_password
      - tt_oidc_client_secret
      - tt_apns_private_key
    read_only: true
    tmpfs: [/tmp]
    # Default: no volumes. The PWA is part of the image; uploaded files are stored in the database (admin UI: storage rule
    # "everything -> database", global upload limit) or in S3. OPTIONAL local-path storage (admin sets /data/files):
    # uncomment this block and the top-level `volumes:` entry `files`.
    # volumes:
    #   - files:/data/files
    healthcheck:
      # /ready = database reachable AND all migrations applied (the image's own HEALTHCHECK only checks /health)
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    logging: *logging

  # OPTIONAL database for single-host setups without an existing MariaDB: docker compose --profile db up -d
  # (then use DB_HOST=db and DB_TLS=off in .env; the database is only reachable inside the Compose network).
  db:
    profiles: ["db"]
    image: mariadb:12.3
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-timetrack}
      MARIADB_USER: ${DB_USER:-timetrack}
      MARIADB_PASSWORD_FILE: /run/secrets/tt_db_password
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    command: ["--max-allowed-packet=70M", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    secrets: [tt_db_password]
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

secrets:
  tt_db_password:
    file: ./secrets/tt_db_password
  tt_storage_secret_key:
    file: ./secrets/tt_storage_secret_key
  tt_vapid_private_key:
    file: ./secrets/tt_vapid_private_key
  # Optional secrets: init-secrets.sh creates placeholder files (content TIMETRACK_PLACEHOLDER_UNSET = "not configured").
  # Put the real value into the file to use the feature.
  tt_smtp_password:
    file: ./secrets/tt_smtp_password
  tt_oidc_client_secret:
    file: ./secrets/tt_oidc_client_secret
  tt_apns_private_key:
    file: ./secrets/tt_apns_private_key

volumes:
  db:
  # files:
