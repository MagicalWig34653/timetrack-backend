# Timetrack production Swarm stack: backend + one-shot migration job. NO database service: the MariaDB is an
# existing server outside this stack (DB_HOST). Step-by-step guide (German): docs/DEPLOYMENT.md.
#
# Render/validate without deploying:
#   set -a; . deploy/swarm/.env; set +a
#   docker stack config -c deploy/swarm/stack.yaml
# Deploy (see docs/DEPLOYMENT.md for the order: secrets -> database -> migrate -> backend):
#   docker stack deploy --with-registry-auth -c deploy/swarm/stack.yaml timetrack
#
# Values come from the shell environment (deploy/swarm/.env.example documents every variable with an example).
# `docker stack deploy` does NOT read .env files by itself: source .env as shown above.
# Passwords and keys are NEVER variables here: they are Docker secrets (deploy/swarm/create-secrets.sh) that the
# image entrypoint reads through the <NAME>_FILE convention (scripts/docker-entrypoint.sh).
#
# Legend: REQUIRED = the stack refuses to render without it. OPTIONAL = has a safe default or can stay empty.
# Not provided by this file (operator): the MariaDB database + user, the image in a registry the nodes can pull from,
# the Docker secrets, and the reverse proxy itself (it connects to the published port on any node).

services:
  # One-shot schema migration (Swarm job, runs once per service create/update). Order, see docs/DEPLOYMENT.md:
  #   first deployment: BACKEND_REPLICAS=0, wait until this job is "Complete", then scale the backend up;
  #   updates: `docker service update --force --image "$TIMETRACK_IMAGE" timetrack_migrate`, wait, then update the backend.
  # The backend never migrates (AUTO_MIGRATE=false) and reports /ready = 503 until the schema is current.
  migrate:
    image: ${TIMETRACK_IMAGE:?set TIMETRACK_IMAGE}
    command: ["migrate", "--yes", "--env", "production"]
    # Least privilege: only database access; no storage, push or mail keys.
    environment:
      DATABASE_DRIVER: mariadb
      DB_HOST: ${DB_HOST:?set DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-timetrack}
      DB_USER: ${DB_USER:-timetrack}
      DB_PASSWORD_FILE: /run/secrets/tt_db_password
      DB_TLS: ${DB_TLS:-required}
      AUTO_MIGRATE: "false"
    secrets:
      - tt_db_password
    read_only: true
    tmpfs:
      - /tmp
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    deploy:
      mode: replicated-job
      replicas: 1
      restart_policy:
        condition: none
      resources:
        limits: { cpus: "1.0", memory: 512M }

  backend:
    image: ${TIMETRACK_IMAGE:?set TIMETRACK_IMAGE}
    # Default command of the image: serve --env production --hostname 0.0.0.0 --port 8080
    environment:
      # ---- Database (existing MariaDB, not part of this stack) ----
      DATABASE_DRIVER: mariadb                                  # fixed: SQLite is not supported in a Swarm
      DB_HOST: ${DB_HOST:?set DB_HOST}                          # REQUIRED. With DB_TLS=required the name must match the server certificate
      DB_PORT: ${DB_PORT:-3306}                                 # OPTIONAL
      DB_NAME: ${DB_NAME:-timetrack}                            # OPTIONAL
      DB_USER: ${DB_USER:-timetrack}                            # OPTIONAL
      DB_PASSWORD_FILE: /run/secrets/tt_db_password             # secret
      DB_TLS: ${DB_TLS:-required}                               # OPTIONAL: required (default) | off
      DB_POOL_CONNECTIONS_PER_LOOP: ${DB_POOL_CONNECTIONS_PER_LOOP:-1}   # OPTIONAL (1..8): connections per CPU core and replica
      DB_KEEPALIVE_SECONDS: ${DB_KEEPALIVE_SECONDS:-45}         # OPTIONAL: 0 = off
      AUTO_MIGRATE: "false"                                     # fixed: migrations run in the migrate job only
      # ---- Public address and passkeys (the RP ID cannot be changed later without invalidating all passkeys) ----
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL (https://host)}      # REQUIRED, for example https://timetrack.example.test
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?set WEBAUTHN_RP_ID (public host name)}     # REQUIRED, lowercase host without scheme/port
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?set WEBAUTHN_ORIGIN (https://host)}      # REQUIRED, must equal the browser origin
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Timetrack}          # OPTIONAL: display name in the passkey dialog
      APPLE_APP_IDS: ${APPLE_APP_IDS:-}                         # OPTIONAL: <TeamID>.<BundleID>[,...]; empty = AASA endpoint answers 404
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-336}              # OPTIONAL (1..8760; the code default is 720, this stack uses 336 = 14 days)
      # ---- Reverse proxy: networks that may report the client address (without it all clients share one rate-limit bucket) ----
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}             # OPTIONAL but strongly recommended behind a proxy
      TRUSTED_PROXY_HEADER: ${TRUSTED_PROXY_HEADER:-X-Forwarded-For}   # OPTIONAL: X-Forwarded-For | X-Real-IP
      # ---- Encryption of stored S3 credentials; S3 itself is configured in the admin UI, not here ----
      STORAGE_SECRET_KEY_FILE: /run/secrets/tt_storage_secret_key      # secret
      # ---- Web Push (VAPID) ----
      VAPID_PRIVATE_KEY_FILE: /run/secrets/tt_vapid_private_key        # secret
      VAPID_SUBJECT: ${VAPID_SUBJECT:?set VAPID_SUBJECT (a mailto or https contact URI)}   # REQUIRED here, for example mailto:admin@example.test
      PUSH_ALLOWED_HOSTS: ${PUSH_ALLOWED_HOSTS:-}               # OPTIONAL: replaces the built-in push-service allow-list (ADR-0011)
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}     # OPTIONAL: background reminder runner
      # ---- Modules and maintenance ----
      MODULES_DISABLED: ${MODULES_DISABLED:-}                   # OPTIONAL: reports,planning,transfer,automation,mcp,groups
      MAINTENANCE_INTERVAL_MINUTES: ${MAINTENANCE_INTERVAL_MINUTES:-60}   # OPTIONAL: 0 = off (0..10080)
      MCP_AUDIT_RETENTION_DAYS: ${MCP_AUDIT_RETENTION_DAYS:-90}            # OPTIONAL (1..3650)
      IMPORT_JOB_TIMEOUT_HOURS: ${IMPORT_JOB_TIMEOUT_HOURS:-168}           # OPTIONAL (1..8760)
      STORAGE_ORPHAN_GRACE_HOURS: ${STORAGE_ORPHAN_GRACE_HOURS:-168}       # OPTIONAL (1..8760)
      PWA_STATIC_DIR: /srv/pwa                                  # fixed: the PWA is part of the image
      # ---- OPTIONAL: e-mail recovery codes (SMTP). To enable, uncomment ALL lines of this block, the secret below and in
      # the `secrets:` lists, and set the values in .env. SMTP_USER and SMTP_PASSWORD must be set together or both
      # omitted (an empty SMTP_USER is rejected), so this block cannot be empty-valued.
      # SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      # SMTP_PORT: ${SMTP_PORT:-587}
      # SMTP_TLS: ${SMTP_TLS:-starttls}                         # starttls | implicit ("off" only for loopback test hosts)
      # SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM}
      # SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Timetrack}
      # SMTP_USER: ${SMTP_USER:?set SMTP_USER}
      # SMTP_PASSWORD_FILE: /run/secrets/tt_smtp_password
      # ---- OPTIONAL: OpenID Connect login. Uncomment this block, the secret below and in the `secrets:` lists. ----
      # OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER}
      # OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      # OIDC_NAME: ${OIDC_NAME:-OpenID Connect}
      # OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      # OIDC_CLIENT_SECRET_FILE: /run/secrets/tt_oidc_client_secret
      # ---- OPTIONAL: APNs push for the Apple apps (ADR-0030). Uncomment this block, the secret below and in the `secrets:`
      # lists, and set the values in .env. ALL four values are needed; with an incomplete configuration APNs stays off.
      # The secret holds the PEM text of the Apple .p8 key (create-secrets.sh --apns-private-key-file FILE).
      # APNS_KEY_ID: ${APNS_KEY_ID:?set APNS_KEY_ID}
      # APNS_TEAM_ID: ${APNS_TEAM_ID:?set APNS_TEAM_ID}
      # APNS_BUNDLE_IDS: ${APNS_BUNDLE_IDS:?set APNS_BUNDLE_IDS}   # comma separated, for example com.example.timetrack
      # APNS_PRIVATE_KEY_FILE: /run/secrets/tt_apns_private_key
    secrets:
      - tt_db_password
      - tt_storage_secret_key
      - tt_vapid_private_key
      # - tt_smtp_password
      # - tt_oidc_client_secret
      # - tt_apns_private_key
    # Default: NO volumes. The PWA is built into the image and uploaded files are stored in the database (admin UI: storage
    # rule "everything -> database" plus a global upload limit). S3 storage also needs no volume (admin UI, secret in the DB).
    # OPTIONAL local-path file storage (the admin then sets the path /data/files in a storage rule). Uncomment BOTH this block
    # and the top-level `volumes:` block at the end, and PIN the backend to one node via BACKEND_PLACEMENT (a node-local
    # volume exists only there), or use a shared volume driver (NFS etc.). The root filesystem stays read-only otherwise.
    # volumes:
    #   - type: volume
    #     source: timetrack-files
    #     target: /data/files
    # The port is published on EVERY node (Swarm routing mesh, mode ingress): any node IP:PUBLISHED_PORT reaches a healthy replica.
    # Point the reverse proxy (outside or inside Swarm) at one or more node addresses on this port and firewall the port so
    # that only the proxy can reach it. Behind the routing mesh the backend sees the ingress network as the TCP peer: put
    # the ingress subnet (docker network inspect ingress) into TRUSTED_PROXY_CIDRS so that X-Forwarded-For is honoured.
    ports:
      - { target: 8080, published: "${PUBLISHED_PORT:-18080}", protocol: tcp, mode: ingress }
    # The container check uses /ready (database reachable AND all migrations applied): a new image whose schema has
    # not been migrated never becomes healthy, so the rolling update stops and rolls back instead of serving errors.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    logging: *logging
    deploy:
      replicas: ${BACKEND_REPLICAS:-1}
      placement:
        constraints:
          # No node pinning needed: the image contains the PWA and files live in the database. Optional narrowing.
          - ${BACKEND_PLACEMENT:-node.platform.os == linux}
      resources:
        limits: { cpus: "1.0", memory: 768M }
        reservations: { cpus: "0.1", memory: 128M }
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: pause
        monitor: 30s

# OPTIONAL (only with the local-path file storage above):
# volumes:
#   timetrack-files:

secrets:
  tt_db_password:
    external: true
  tt_storage_secret_key:
    external: true
  tt_vapid_private_key:
    external: true
  # tt_smtp_password:
  #   external: true
  # tt_oidc_client_secret:
  #   external: true
  # tt_apns_private_key:
  #   external: true
