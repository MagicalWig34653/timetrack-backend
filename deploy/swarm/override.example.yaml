# Example overlay for stack.yaml, ONLY for special cases that .env cannot express: additional networks, labels, resource
# limits, volumes. All features (SMTP, OIDC, APNs, push, files, modules ...) are controlled through .env, not here.
# Copy to override.yaml (not tracked) and keep only what you need. Usage:
#   set -a; . ./.env; set +a
#   docker stack config -c stack.yaml -c override.yaml          # shows the merged result, deploys nothing
#   docker stack deploy --with-registry-auth -c stack.yaml -c override.yaml timetrack
# update.sh needs the same files only to recreate a missing migrate service: STACK_OVERRIDE_FILES=override.yaml
# or --stack-override override.yaml (docs/DEPLOYMENT.md).
# Merge rules (Compose): `environment` is merged by key (the overlay wins), `secrets`/`ports` lists are merged,
# scalar values (for example `replicas`) are replaced. A key can NOT be removed by an overlay.

# Examples (uncomment and adapt; replace the empty `backend: {}` below when you use them):
#   services:
#     backend:
#       networks: [proxy]                              # attach to an existing overlay network of the reverse proxy
#       deploy:
#         labels: ["example.label=timetrack"]          # labels for reverse proxy auto-discovery
#         resources:
#           limits: { cpus: "2.0", memory: 1024M }     # deviating resource limit
#       environment:
#         SOME_VARIABLE: some-value                    # a variable that stack.yaml does not pass through
#   networks:
#     proxy:
#       external: true

services:
  backend: {}
