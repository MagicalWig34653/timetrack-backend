          required: [token]
          properties: { token: { type: string } }
    SegmentKind: { type: string, enum: [work, travel, school] }
    DayMarkKind: { type: string, enum: [none, holiday, vacation, sick, excused, school_credit] }
    WorkModelInput:
      type: object
