              weekday: { type: integer, minimum: 1, maximum: 7, description: nur report_gap }
              time: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', description: nur report_gap, lokal }
        quietStart: { type: [string, 'null'], pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        quietEnd: { type: [string, 'null'], pattern: '^[0-2][0-9]:[0-5][0-9]$' }
    PushSubscriptionInfo:
      type: object
      required: [id, createdAt]
      properties:
        id: { type: string, format: uuid }
        host: { type: string, description: Push-Dienst-Host (nicht der volle Endpunkt) }
        userAgent: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        lastSuccessAt: { type: [string, 'null'], format: date-time }
    ModuleKey:
      type: string
      enum: [reports, planning, transfer, automation, mcp]
    ModuleStatus:
      type: object
      required: [key, serverEnabled, accountEnabled, effective, lockedByOperator]
      properties:
        key: { $ref: '#/components/schemas/ModuleKey' }
        serverEnabled: { type: boolean }
        accountEnabled: { type: boolean }
        effective: { type: boolean }
        lockedByOperator: { type: boolean }
    ServerModule:
      type: object
      required: [key, enabled, lockedByOperator]
      properties:
        key: { $ref: '#/components/schemas/ModuleKey' }
        enabled: { type: boolean }
        lockedByOperator: { type: boolean }
    WorktimeAction:
      type: string
      enum: [work, school, vacation, sick, excused, holiday, skip]
    WorktimeRemarkRule:
      type: object
      required: [pattern, action]
      properties:
        pattern: { type: string, maxLength: 80, description: Teilstring (ohne Groß/Kleinschreibung); mit ^ und $ als exakter Text }
        action: { $ref: '#/components/schemas/WorktimeAction' }
    WorktimeOptions:
      type: object
      properties:
        pauseMode: { type: string, enum: [split, none], default: split }
        pauseMinutes: { type: [integer, 'null'], minimum: 0, maximum: 240, description: null = Wert aus der Tabelle (H1) }
        pauseStart: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', default: '12:00' }
        roundToMinutes: { type: boolean, default: true }
        holidayTimes: { type: string, enum: [discard, keep], default: discard, description: 'Zeilen mit Zeiten auf gesetzlichen oder eigenen Feiertagen. discard = keine Abschnitte, Tag gilt als Feiertag (Warnung holiday_times_discarded); keep = als Arbeit/Schule übernehmen (Mehrarbeit)' }
        partialCredit: { type: string, enum: [work, absence], default: work, description: 'Zeilen der Aktion vacation/sick/excused, deren Nettozeit mehr als 5 Minuten vom Tages-Soll abweicht. work = als Arbeit mit Notiz übernehmen (Warnung credit_partial_as_work); absence = trotzdem als Abwesenheit' }
        rules: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/WorktimeRemarkRule' }, description: fehlend/null = Standardregeln; eine leere Liste ersetzt sie durch keine Regeln (alles wird Arbeit) }
    WorktimePreview:
      type: object
      properties:
        days: { type: integer }
        segments: { type: integer }
        absences: { type: integer }
        customDays: { type: integer }
        skippedHolidays: { type: integer }
        firstDate: { type: [string, 'null'], format: date }
        lastDate: { type: [string, 'null'], format: date }
        dateSystem: { type: string, enum: ['1900', '1904'] }
        sheetBalanceSeconds: { type: [integer, 'null'], description: Summe der zwischengespeicherten Differenzen der Tabelle über alle Zeilen (nur Hinweis) }
        sheetBalanceUpToTodaySeconds: { type: [integer, 'null'], description: 'wie sheetBalanceSeconds, aber nur Zeilen bis einschließlich heute (vergleichbar mit dem Zeitkonto der App)' }
        sheetBalanceFutureSeconds: { type: [integer, 'null'], description: Anteil der Zeilen nach heute }
        firstContentDate: { type: [string, 'null'], format: date, description: 'erster Tag mit Zeiten oder Bemerkung; Vorschlag für den Beginn des Arbeitsmodells, damit leere Tage davor nicht als Fehlzeit zählen' }
        unmappedRemarks: { type: array, items: { type: object, required: [text, count], properties: { text: { type: string }, count: { type: integer } } } }
        byAction: { type: object, additionalProperties: { type: integer } }
    AdminAccount:
      type: object
      required: [id, handle, displayName, role, state, createdAt, passkeyCount]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
        displayName: { type: string }
        email: { type: [string, 'null'] }
        role: { type: string, enum: [admin, member] }
        state: { type: string, enum: [active, disabled] }
        createdAt: { type: string, format: date-time }
        disabledAt: { type: [string, 'null'], format: date-time }
        lastActivityAt: { type: [string, 'null'], format: date-time, description: jüngste Sitzungsnutzung oder Passkey-Anmeldung }
        passkeyCount: { type: integer, minimum: 0 }
    AdminAccountPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminAccount' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    AdminAccountPatch:
      type: object
      minProperties: 1
      properties:
        role: { type: string, enum: [admin, member] }
        state: { type: string, enum: [active, disabled] }
    AccountDeletionConfirm:
      type: object
      required: [confirmHandle]
      properties:
        confirmHandle: { type: string, description: Handle des zu löschenden Kontos (Tippbestätigung) }
