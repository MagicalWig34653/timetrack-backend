    Notification:
      type: object
      required: [id, kind, title, body, createdAt, read]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/NotificationKind' }
        title: { type: string }
        body: { type: string }
        url: { type: [string, 'null'], description: relativer PWA-Pfad }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
    NotificationSettings:
      type: object
      required: [categories]
