    Place:
      allOf:
        - $ref: '#/components/schemas/PlaceInput'
        - type: object
          required: [id, archived]
          properties: { id: { type: string, format: uuid }, archived: { type: boolean } }
    SegmentInput:
      type: object
      required: [kind, startedAt]
      properties:
        kind: { $ref: '#/components/schemas/SegmentKind' }
        placeId: { type: [string, 'null'], format: uuid }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        note: { type: [string, 'null'], maxLength: 500 }
    SegmentCorrection:
      type: object
      required: [reason]
      properties:
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        kind: { $ref: '#/components/schemas/SegmentKind' }
        placeId: { type: [string, 'null'], format: uuid }
        note: { type: [string, 'null'], maxLength: 500 }
        reason: { type: string, minLength: 1, maxLength: 200 }
        needsReview: { type: boolean, enum: [false], description: 'Explizite Quittierung; true ist ungültig.' }
    Adjustment:
      type: object
      required: [id, kind, date, seconds, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [opening, correction] }
        date: { type: string, format: date }
        seconds: { type: integer, description: 'Vorzeichenbehafteter Betrag in Sekunden.' }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
    AdjustmentPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Adjustment' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    Segment:
      type: object
      required: [id, kind, startedAt, endedAt, rawStartedAt, rawEndedAt, source, version, voided, needsReview]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/SegmentKind' }
        placeId: { type: [string, 'null'], format: uuid }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        rawStartedAt: { type: string, format: date-time }
        rawEndedAt: { type: [string, 'null'], format: date-time }
        source: { type: string, enum: [timer, manual, automation, suggestion, import] }
        note: { type: [string, 'null'] }
        version: { type: integer }
        voided: { type: boolean }
        needsReview: { type: boolean }
        revisions: { type: integer, description: Anzahl Korrekturen }
    CancelledSegment:
      type: object
      required: [segment, cancelledAt]
      properties:
        segment: { $ref: '#/components/schemas/Segment' }
        cancelledAt: { type: string, format: date-time }
        cancelReason: { type: [string, 'null'] }
    CancelledSegmentPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CancelledSegment' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    PurgeSummary:
      type: object
      description: 'Anzahl der entfernten (bei dryRun zu entfernenden) Datensätze. Einzige Spur einer endgültigen Löschung; es bleibt kein Grabstein.'
      required: [dryRun, segments, revisions, suggestions, timerEvents, automationEvents]
      properties:
        dryRun: { type: boolean }
        segments: { type: integer }
        revisions: { type: integer }
        suggestions: { type: integer }
        timerEvents: { type: integer }
        automationEvents: { type: integer, description: Ereignisse, deren Segmentbezug entfernt wurde (Zeilen bleiben erhalten) }
    TimeStatistics:
      type: object
      required: [from, to, granularity, basis, timezone, buckets, totals]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        granularity: { type: string, enum: [day, week, month] }
        basis: { type: string, enum: [evaluated, raw] }
        timezone: { type: string }
        accountStart: { type: [string, 'null'], format: date }
        openingBalanceSeconds: { type: [integer, 'null'], description: Zeitkontostand am Ende des Vortags von `from` (Basislinie); null vor Kontobeginn }
        buckets: { type: array, items: { $ref: '#/components/schemas/StatisticsBucket' } }
        totals:
          type: object
          required: [targetSeconds, targetToDateSeconds, actualSeconds, creditSeconds, deltaSeconds, overtimeSeconds, undertimeSeconds, breakSeconds, breakDeductionSeconds, kindSeconds, absenceDays]
          properties:
            targetSeconds: { type: integer }
            targetToDateSeconds: { type: integer }
            actualSeconds: { type: integer }
            creditSeconds: { type: integer }
            deltaSeconds: { type: integer }
            overtimeSeconds: { type: integer }
            undertimeSeconds: { type: integer }
            breakSeconds: { type: integer }
            breakDeductionSeconds: { type: integer }
            kindSeconds: { $ref: '#/components/schemas/StatisticsKinds' }
            absenceDays: { type: number }
    StatisticsKinds:
      type: object
      required: [work, school, travel]
      properties: { work: { type: integer }, school: { type: integer }, travel: { type: integer } }
    StatisticsBucket:
      type: object
      required: [label, from, to, days, targetSeconds, targetToDateSeconds, actualSeconds, creditSeconds, evaluatedWorkSeconds, rawWorkSeconds, roundingSeconds, deltaSeconds, overtimeSeconds, undertimeSeconds, kindSeconds, absences, absenceDays, breakSeconds, breakDeductionSeconds, workDays, provisional]
      properties:
        label: { type: string, description: 'Tag 2026-10-12, ISO-Woche 2026-W42 oder Monat 2026-10' }
        from: { type: string, format: date }
        to: { type: string, format: date }
        days: { type: integer }
        targetSeconds: { type: integer, description: Soll aller Tage des Buckets }
        targetToDateSeconds: { type: integer, description: Soll der Tage bis heute }
        actualSeconds: { type: integer, description: Ist nach basis (ohne Gutschrift) }
        creditSeconds: { type: integer }
        evaluatedWorkSeconds: { type: integer }
        rawWorkSeconds: { type: integer, description: Rohzeit vor festen Pausen und Rundung }
        roundingSeconds: { type: integer, description: Summe der Rundungsanpassungen (Beginn/Ende) }
        deltaSeconds: { type: integer, description: Differenz = Ist + Gutschrift - Soll, nur Tage bis heute }
        overtimeSeconds: { type: integer }
        undertimeSeconds: { type: integer }
        balanceSeconds: { type: [integer, 'null'], description: Kumulierter Zeitkontostand zum Stand balanceAsOf (offiziell, bewertet); null vor Kontobeginn }
        balanceAsOf: { type: [string, 'null'], format: date }
        kindSeconds: { $ref: '#/components/schemas/StatisticsKinds' }
        absences:
          type: object
          description: Tage je Markierung (Urlaub halbe Tage als 0.5)
          required: [vacation, sick, excused, holiday, school]
          properties: { vacation: { type: number }, sick: { type: number }, excused: { type: number }, holiday: { type: number }, school: { type: number } }
        absenceDays: { type: number, description: Urlaub + krank + entschuldigt (ohne Feiertage und Schule) }
        breakSeconds: { type: integer, description: Tatsächliche Lücken zwischen Abschnitten (keine erfundenen Pausen) }
        breakDeductionSeconds: { type: integer, description: Abgezogene feste Pausen des Arbeitsmodells }
        workDays: { type: integer }
        provisional: { type: boolean }
    DayEvaluation:
      type: object
      required: [date, targetSeconds, rawWorkSeconds, breakDeductionSeconds, startAdjustSeconds, endAdjustSeconds, evaluatedWorkSeconds, creditSeconds, deltaSeconds, provisional, segmentIds, breakHints]
      properties:
        date: { type: string, format: date }
        modelId: { type: [string, 'null'], format: uuid }
        mark: { $ref: '#/components/schemas/DayMarkKind' }
        skipFixedBreaks: { type: boolean }
        targetSeconds: { type: integer }
        rawWorkSeconds: { type: integer }
        breakDeductionSeconds: { type: integer }
        startAdjustSeconds: { type: integer }
        endAdjustSeconds: { type: integer }
        evaluatedWorkSeconds: { type: integer }
        creditSeconds: { type: integer, description: Schulregel/Markierungsgutschrift anstelle der Segmentsumme }
        deltaSeconds: { type: integer, description: evaluated(+credit) - target }
        evaluatedStart: { type: [string, 'null'], format: date-time }
        evaluatedEnd: { type: [string, 'null'], format: date-time }
        provisional: { type: boolean }
        segmentIds: { type: array, items: { type: string, format: uuid } }
        segments: { type: array, items: { $ref: '#/components/schemas/Segment' }, description: Segmente dieses Arbeitstags (Zuordnung nach ADR-0004; ohne stornierte) }
        markCreditSeconds: { type: [integer, 'null'], description: gesetzte Gutschrift der Markierung }
        markSource: { type: string, enum: [none, explicit, absence, holiday], description: Herkunft der wirksamen Markierung (explicit = manuell gesetzt) }
        targetOverrideSeconds: { type: [integer, 'null'], description: 'abweichendes Soll, z. B. halber Urlaubstag' }
        note: { type: [string, 'null'] }
        breakHints: { type: array, items: { type: object, required: [code], properties: { code: { type: string, enum: [break_missing_30, break_missing_45, break_part_too_short, work_over_6h_without_break] } } } }
    TimeAccount:
      type: object
      required: [asOf, balanceSeconds, openingSeconds, adjustmentSeconds, provisional]
      properties:
        asOf: { type: string, format: date }
        accountStart: { type: [string, 'null'], format: date }
        balanceSeconds: { type: integer }
        openingSeconds: { type: integer }
        adjustmentSeconds: { type: integer }
        provisional: { type: boolean }
    Suggestion:
      type: object
      required: [id, type, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [start, end] }
        placeId: { type: [string, 'null'], format: uuid }
        proposedStartedAt: { type: [string, 'null'], format: date-time }
        proposedEndedAt: { type: [string, 'null'], format: date-time }
        segmentId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
    DeviceToken:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scope: { type: string, const: automation }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
    TriggerLink:
      type: object
      required: [id, label, actions, kind, createdAt]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        actions: { type: array, items: { type: string, enum: [start, stop, toggle] } }
        placeId: { type: [string, 'null'], format: uuid }
        kind: { type: string, enum: [work, travel, school] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        lastAction: { type: [string, 'null'], enum: [start, stop, toggle, null] }
        token: { type: string, description: 'nur in der POST-Antwort' }
        path: { type: string, description: 'nur in der POST-Antwort: /t/<token>' }
    TriggerError:
      type: object
      required: [error]
      description: Knappe Fehlerform der Auslöse-Link-Antworten (kein Fehler-Umschlag)
      properties:
        error: { type: string }
    TriggerResult:
      type: object
      required: [result, action]
      properties:
        result: { type: string, enum: [started, stopped, suggested, already_running, already_stopped, ignored, needs_review] }
        action: { type: string, enum: [start, stop, toggle] }
        segmentId: { type: [string, 'null'], format: uuid }
        suggestionId: { type: [string, 'null'], format: uuid }
        at: { type: [string, 'null'], format: date-time }
    AutomationEvent:
      type: object
      required: [eventId, deviceId, type, occurredAt, placeId]
      properties:
        eventId: { type: string, format: uuid }
        deviceId: { type: string, maxLength: 80 }
        type: { type: string, enum: [arrival, presence_confirmed, departure, cancel] }
        placeId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
    VacationSettings:
      type: object
      required: [region, annualEntitlementHalfDays]
      properties:
        configured: { type: boolean, readOnly: true, description: false solange keine Einstellungen gespeichert sind; GET liefert dann die Standardwerte (200) }
        region: { type: string, default: DE-ST }
        annualEntitlementHalfDays: { type: integer, minimum: 0, default: 60, description: 30 Tage = 60 halbe Tage (ADR-0005) }
        carryOverByYear: { type: object, additionalProperties: { type: integer, minimum: 0 }, description: 'Übertrag je Urlaubsjahr in halben Tagen, z. B. {"2026": 8}; fehlend = 0, gilt nicht bei Stichtagsbestand im selben Jahr' }
        carryOverExpiry: { type: [string, 'null'], description: Verfall als MM-DD (z. B. 03-31) oder null }
    VacationBalance:
      type: object
      required: [year, entitlementHalfDays, carryOverHalfDays, adjustmentHalfDays, bookedHalfDays, plannedHalfDays, availableHalfDays, availableAfterPlannedHalfDays]
      properties:
        year: { type: integer }
        snapshotDate: { type: [string, 'null'], format: date }
        snapshotRemainingHalfDays: { type: [integer, 'null'], description: Stichtagsbestand; bei Snapshot sind Anspruch und Übertrag des Jahres 0 }
        entitlementHalfDays: { type: integer }
        carryOverHalfDays: { type: integer }
        adjustmentHalfDays: { type: integer }
        bookedHalfDays: { type: integer, description: Status approved oder taken }
        plannedHalfDays: { type: integer, description: Status planned oder requested }
        availableHalfDays: { type: integer }
        availableAfterPlannedHalfDays: { type: integer }
    VacationSuggestions:
      type: object
      required: [from, to, budget, suggestions]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        budget:
          type: object
          required: [entitlementDays, takenDays, plannedDays, remainingDays]
          description: Tage (halbe möglich) für das Jahr von `from`. entitlementDays = Anspruch + Übertrag + Korrekturen (oder Stichtagsbestand + Buchungen danach); remainingDays = verfügbar nach geplantem Urlaub.
          properties:
            entitlementDays: { type: number }
            takenDays: { type: number, description: Status approved oder taken }
            plannedDays: { type: number, description: Status planned oder requested }
            remainingDays: { type: number }
        suggestions:
          type: array
          items: { $ref: '#/components/schemas/VacationSuggestion' }
    VacationSuggestion:
      type: object
      required: [id, kind, start, end, vacationDates, vacationDaysNeeded, totalDaysOff, efficiency, holidays, schoolHolidays, conflicts, fitsBudget, remainingAfter]
      properties:
        id: { type: string, description: stabil (Hash aus Beginn, Ende und Urlaubstagen), 16 Hexzeichen }
        kind: { type: string, enum: [bridge, holiday_cluster, school_holiday_extension, long_break], description: school_holiday_extension bei Überlappung mit eigenen Schulferien; sonst bridge (Feiertag, höchstens 2 Urlaubstage), holiday_cluster (Feiertag, mehr Urlaubstage), long_break (ohne Feiertag) }
        start: { type: string, format: date, description: erster freier Tag (inklusive Wochenende/Feiertage davor) }
        end: { type: string, format: date, description: letzter freier Tag }
        vacationDates: { type: array, items: { type: string, format: date }, description: Arbeitstage, die Urlaub kosten (ganze Tage) }
        vacationDaysNeeded: { type: integer }
        totalDaysOff: { type: integer, description: Kalendertage von start bis end }
        efficiency: { type: number, description: totalDaysOff / vacationDaysNeeded, auf 2 Stellen gerundet }
        holidays:
          type: array
          items: { type: object, required: [date, name], properties: { date: { type: string, format: date }, name: { type: string } } }
        schoolHolidays:
          type: array
          description: Überlappende, selbst eingetragene Schulferien
          items: { type: object, required: [startDate, endDate, name], properties: { startDate: { type: string, format: date }, endDate: { type: string, format: date }, name: { type: string } } }
        conflicts:
          type: array
          items:
            type: object
            required: [date, type]
            properties:
              date: { type: string, format: date }
              type: { type: string, enum: [absence, school_day, plan, already_vacation], description: absence = Krankheit/Sonstiges; school_day = Plantag Modus school; plan = geplante Arbeit; already_vacation = bereits eingetragener Urlaub (kostet nichts, liegt im Fenster) }
        fitsBudget: { type: boolean }
        remainingAfter: { type: number, description: Resttage des Jahres von start nach diesem Vorschlag (negativ möglich) }
    AbsenceInput:
      type: object
      required: [kind, startDate, endDate, status]
      properties:
        kind: { type: string, enum: [vacation, sick, excused, other], description: excused = bezahlt frei ohne Urlaubsverbrauch (ADR-0013) }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        halfDayStart: { type: boolean, default: false, description: erster Tag nur halber Tag }
        halfDayEnd: { type: boolean, default: false, description: letzter Tag nur halber Tag }
        status: { type: string, enum: [planned, requested, approved, rejected, cancelled, taken] }
        note: { type: [string, 'null'], maxLength: 500 }
        documentStatus: { type: string, enum: [not_needed, pending, submitted], default: not_needed }
        documentSubmittedOn: { type: [string, 'null'], format: date }
        documentReferenceStart: { type: [string, 'null'], format: date }
        documentReferenceEnd: { type: [string, 'null'], format: date }
    Absence:
      allOf:
        - $ref: '#/components/schemas/AbsenceInput'
        - type: object
          required: [id, version, countedHalfDays, attachmentCount]
          properties: { id: { type: string, format: uuid }, version: { type: integer }, countedHalfDays: { type: integer, description: 'berechneter Verbrauch (nur Arbeitstage, ohne Feiertage)' }, attachmentCount: { type: integer, minimum: 0, description: 'Anzahl gespeicherter, lesbarer Anhänge (ohne Dateien im Löschen/Fehlerzustand)' } }
    CalendarDay:
      type: object
      required: [startDate, endDate, name, kind, source]
      properties:
        id: { type: [string, 'null'], format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        name: { type: string }
        kind: { type: string, enum: [holiday, school_holiday] }
        source: { type: string, enum: [builtin, custom] }
    PlanDayInput:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [office, home, customer, school, off] }
        placeId: { type: [string, 'null'], format: uuid }
        note: { type: [string, 'null'], maxLength: 200 }
        plannedStart: { type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'Geplanter Beginn, lokale Uhrzeit HH:mm; zusammen mit plannedEnd, kleiner als plannedEnd. Bei mode off ignoriert.' }
        plannedEnd: { type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 'Geplantes Ende, lokale Uhrzeit HH:mm am selben Tag.' }
        plannedBreakMinutes: { type: [integer, 'null'], minimum: 0, maximum: 600, description: 'Geplante Pause; nur zusammen mit Zeiten.' }
    PlanDay:
      allOf:
        - $ref: '#/components/schemas/PlanDayInput'
        - type: object
          required: [date]
          properties:
            date: { type: string, format: date }
            plannedSeconds: { type: [integer, 'null'], readOnly: true, description: 'Ende − Beginn − Pause, nie negativ; null ohne Zeiten.' }
    PlanWeekInput:
      type: object
      required: [days]
      properties:
        replace: { type: boolean, default: false }
        days:
          type: array
          maxItems: 7
          items:
            allOf:
              - $ref: '#/components/schemas/PlanDayInput'
              - { type: object, required: [date], properties: { date: { type: string, format: date } } }
    PlanWeekDay:
      type: object
      required: [date, weekday, targetSeconds, plannedSeconds, blockedBy, plan]
      properties:
        date: { type: string, format: date }
        weekday: { type: integer, minimum: 1, maximum: 7, description: 'ISO, Montag = 1' }
        targetSeconds: { type: integer }
        plannedSeconds: { type: [integer, 'null'], description: 'Effektiv: 0 bei blockiertem Tag, null ohne Plan oder ohne Zeiten.' }
        blockedBy: { type: [string, 'null'], enum: [holiday, vacation, sick, excused, null] }
        plan: { oneOf: [ { $ref: '#/components/schemas/PlanDay' }, { type: 'null' } ] }
    PlanWeek:
      type: object
      required: [week, from, to, days, totals]
      properties:
        week: { type: string, example: 2026-W44 }
        from: { type: string, format: date }
        to: { type: string, format: date }
        days: { type: array, items: { $ref: '#/components/schemas/PlanWeekDay' }, minItems: 7, maxItems: 7 }
        totals:
          type: object
          required: [targetSeconds, plannedSeconds, differenceSeconds]
          properties: { targetSeconds: { type: integer }, plannedSeconds: { type: integer }, differenceSeconds: { type: integer, description: plannedSeconds − targetSeconds } }
    TimeWeekDay:
      type: object
      required: [date, weekday, mark, markSource, targetSeconds, plannedSeconds, planMode, workSeconds, creditSeconds, rawWorkSeconds, breakSeconds, breakDeductionSeconds, travelSeconds, schoolSeconds, balanceSeconds, firstStart, lastEnd, segmentsCount, absences, provisional, isToday, isFuture]
      properties:
        date: { type: string, format: date }
        weekday: { type: integer, minimum: 1, maximum: 7 }
        mark: { type: string, enum: [work, school, vacation, sick, holiday, excused, off], description: 'off = kein Arbeitstag und nichts gebucht (auch Abwesenheit am Wochenende).' }
        markSource: { type: string, enum: [none, explicit, absence, holiday] }
        targetSeconds: { type: integer }
        plannedSeconds: { type: [integer, 'null'] }
        planMode: { type: [string, 'null'], enum: [office, home, customer, school, off, null] }
        workSeconds: { type: integer, description: bewertete Arbeitszeit (evaluatedWorkSeconds) }
        creditSeconds: { type: integer }
        rawWorkSeconds: { type: integer }
        breakSeconds: { type: integer, description: tatsächliche Lücken zwischen den Abschnitten des Tages }
        breakDeductionSeconds: { type: integer, description: abgezogene feste Pausen des Arbeitsmodells }
        travelSeconds: { type: integer }
        schoolSeconds: { type: integer }
        balanceSeconds: { type: [integer, 'null'], description: 'work + credit − target (deltaSeconds); null nach heute' }
        firstStart: { type: [string, 'null'], format: date-time }
        lastEnd: { type: [string, 'null'], format: date-time }
        segmentsCount: { type: integer }
        absences:
          type: array
          items: { type: object, required: [kind, status, halfDay], properties: { kind: { type: string, enum: [vacation, sick, excused, other] }, status: { type: string, enum: [planned, requested, approved, rejected, cancelled, taken] }, halfDay: { type: boolean } } }
        provisional: { type: boolean }
        isToday: { type: boolean }
        isFuture: { type: boolean }
    TimeWeek:
      type: object
      required: [week, from, to, days, summary]
      properties:
        week: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        days: { type: array, items: { $ref: '#/components/schemas/TimeWeekDay' }, minItems: 7, maxItems: 7 }
        summary:
          type: object
          required: [targetSeconds, targetToDateSeconds, workSeconds, creditSeconds, balanceSeconds, plannedSeconds, accountBalanceBeforeSeconds, accountBalanceAfterSeconds, accountBalanceAsOf, vacationDays, sickDays, schoolDays, holidayDays, workDays, travelSeconds, breakSeconds, averageStart, averageEnd, longestDay, provisional]
          properties:
            targetSeconds: { type: integer }
            targetToDateSeconds: { type: integer, description: Soll der Tage bis einschließlich heute }
            workSeconds: { type: integer }
            creditSeconds: { type: integer }
            balanceSeconds: { type: integer, description: Summe der Tagessalden bis heute }
            plannedSeconds: { type: [integer, 'null'], description: null ohne jeden geplanten Tag }
            accountBalanceBeforeSeconds: { type: integer }
            accountBalanceAfterSeconds: { type: integer }
            accountBalanceAsOf: { type: string, format: date, description: 'Sonntag der Woche, höchstens heute' }
            vacationDays: { type: number, description: 'halbe Tage zählen 0.5' }
            sickDays: { type: integer }
            schoolDays: { type: integer }
            holidayDays: { type: integer }
            workDays: { type: integer, description: Tage mit bewerteter Arbeitszeit }
            travelSeconds: { type: integer }
            breakSeconds: { type: integer }
            averageStart: { type: [string, 'null'], description: 'HH:mm lokal' }
            averageEnd: { type: [string, 'null'], description: 'HH:mm lokal' }
            longestDay: { oneOf: [ { type: object, required: [date, seconds], properties: { date: { type: string, format: date }, seconds: { type: integer } } }, { type: 'null' } ] }
            provisional: { type: boolean }
    ShareScopes:
      type: object
      properties:
        plan: { type: boolean, default: false }
        actual: { type: boolean, default: false }
        vacation: { type: boolean, default: false }
    Share:
      type: object
      required: [id, recipientHandle, scopes, createdAt]
      properties:
        id: { type: string, format: uuid }
        recipientHandle: { type: string }
        scopes: { $ref: '#/components/schemas/ShareScopes' }
        createdAt: { type: string, format: date-time }
    IncomingShare:
      type: object
      required: [id, ownerDisplayName, scopes]
      properties:
        id: { type: string, format: uuid }
        ownerDisplayName: { type: string }
        scopes: { $ref: '#/components/schemas/ShareScopes' }
    SharedView:
      type: object
      properties:
        plan: { type: array, items: { type: object, required: [date, mode], properties: { date: { type: string, format: date }, mode: { type: string, enum: [office, home, customer, school, off] }, plannedStart: { type: [string, 'null'] }, plannedEnd: { type: [string, 'null'] }, plannedBreakMinutes: { type: [integer, 'null'] }, plannedSeconds: { type: [integer, 'null'] } } } }
        actual: { type: array, items: { type: object, required: [date, evaluatedWorkSeconds], properties: { date: { type: string, format: date }, evaluatedStart: { type: [string, 'null'], format: date-time }, evaluatedEnd: { type: [string, 'null'], format: date-time }, evaluatedWorkSeconds: { type: integer } } } }
        vacation: { type: array, items: { type: object, required: [startDate, endDate], properties: { startDate: { type: string, format: date }, endDate: { type: string, format: date } } } }
    ImportJob:
      type: object
      required: [id, filename, kind, status, sheets, createdAt]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        kind: { type: string, enum: [csv, xlsx] }
        status: { type: string, enum: [uploaded, mapped, committed, rolled_back] }
        sheets: { type: array, items: { type: string } }
        detectedProfile: { type: string, enum: [generic, worktime_workbook], description: worktime_workbook bei erkannter Arbeitszeit-Tabelle }
        sha256: { type: string }
        createdAt: { type: string, format: date-time }
    ImportMapping:
      type: object
      required: [sheet, headerRow, columns, dateFormat, timeFormat]
      properties:
        profile: { type: string, enum: [generic, worktime_workbook], default: generic, description: Bei worktime_workbook sind sheet/headerRow/columns/Formate ohne Bedeutung (Platzhalter erlaubt) und worktime wird ausgewertet }
        worktime: { $ref: '#/components/schemas/WorktimeOptions' }
        sheet: { type: string }
        headerRow: { type: integer, minimum: 0, description: 0 = keine Kopfzeile }
        timezone: { type: string, default: Europe/Berlin }
        dateFormat: { type: string, enum: [dd.MM.yyyy, yyyy-MM-dd, excel_serial] }
        timeFormat: { type: string, enum: [HH:mm, excel_fraction, decimal_hours] }
        defaultKind: { $ref: '#/components/schemas/SegmentKind' }
        columns:
          type: object
          required: [date]
          properties:
            date: { type: integer, minimum: 0 }
            start: { type: [integer, 'null'], minimum: 0 }
            end: { type: [integer, 'null'], minimum: 0 }
            duration: { type: [integer, 'null'], minimum: 0, description: Dauer statt Ende (Format laut timeFormat) }
            kind: { type: [integer, 'null'], minimum: 0 }
            place: { type: [integer, 'null'], minimum: 0 }
            note: { type: [integer, 'null'], minimum: 0 }
        skipSummaryRows: { type: boolean, default: true }
        allowOvernight: { type: boolean, default: false, description: Ende vor Beginn gilt als Folgetag; sonst Fehler end_before_start (24:00 immer erlaubt) }
    ImportPreview:
      type: object
      required: [rows, valid, errors, duplicates, sample]
      properties:
        rows: { type: integer }
        errorCount: { type: integer, description: Gesamtzahl der Fehler; errors ist auf 1000 begrenzt }
        skippedSummaryRows: { type: integer }
        profile: { type: string, enum: [generic, worktime_workbook] }
        warnings: { type: array, items: { type: object, required: [code], properties: { code: { type: string, enum: [pause_exceeds_day, holiday_times_discarded, credit_partial_as_work, school_on_holiday] }, row: { type: [integer, 'null'] }, count: { type: integer, description: bei zusammengefassten Warnungen die Anzahl betroffener Tage } } }, description: Hinweise ohne Commit-Hindernis }
        worktime: { $ref: '#/components/schemas/WorktimePreview' }
        valid: { type: integer }
        duplicates: { type: integer }
        errors: { type: array, items: { type: object, required: [row, code], properties: { row: { type: integer }, code: { type: string, enum: [date_invalid, time_invalid, end_before_start, missing_value, overlap, formula_without_value, summary_row, unknown_place, unknown_kind, note_too_long, duplicate_date_conflict, planning_disabled] } } } }
        sample: { type: array, items: { type: object, properties: { date: { type: string, format: date }, startedAt: { type: string, format: date-time }, endedAt: { type: string, format: date-time }, kind: { $ref: '#/components/schemas/SegmentKind' } } } }
    ImportResult:
      type: object
      required: [batchId, created, skipped]
      properties:
        rolledBack: { type: integer, description: bei Rollback die Zahl stornierter Segmente }
        absencesCreated: { type: integer }
        customDaysCreated: { type: integer }
        warnings: { type: array, items: { type: object, required: [code], properties: { code: { type: string, enum: [pause_exceeds_day, holiday_times_discarded, credit_partial_as_work, school_on_holiday] }, row: { type: [integer, 'null'] }, count: { type: integer } } }, description: 'wie ImportPreview.warnings, auch im Ergebnis des Commits' }
        batchId: { type: string, format: uuid }
        created: { type: integer }
        skipped: { type: integer }
        conflicts: { type: array, items: { type: string, format: uuid } }
        conflictItems: { type: array, items: { type: object, required: [type, id], properties: { type: { type: string, enum: [segment, absence, custom_day] }, id: { type: string, format: uuid } } }, description: 'typisierte Konfliktliste (zusätzlich zu conflicts), auch im Fehlerobjekt rollback_conflict' }
    ImportTemplate:
      type: object
      required: [id, name, mapping]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        mapping: { $ref: '#/components/schemas/ImportMapping' }
    StorageRule:
      type: object
      required: [backend]
      properties:
        maxBytes: { type: [integer, 'null'], minimum: 1, description: obere Grenze (inklusive); null = alles darüber/Rest }
        backend: { type: string, enum: [db, s3, local] }
    StorageSettingsInput:
      type: object
      required: [rules]
      properties:
        rules: { type: array, minItems: 1, items: { $ref: '#/components/schemas/StorageRule' }, description: geordnet; erste passende Regel gewinnt; letzte muss maxBytes null haben }
        maxUploadBytes: { type: integer, minimum: 1, default: 10485760 }
        localPath: { type: [string, 'null'] }
        s3:
          type: [object, 'null']
          properties:
            endpoint: { type: string }
            region: { type: string }
            bucket: { type: string }
            pathStyle: { type: boolean, default: true }
            accessKeyId: { type: string }
            secretAccessKey: { type: string, writeOnly: true }
    MailHint:
      type: object
      required: [severity, code, message]
      properties: { severity: { type: string, enum: [info, warning] }, code: { type: string }, message: { type: string } }
    MailStatus:
      type: object
      required: [configured, authConfigured, source, hints]
      properties:
        configured: { type: boolean }
        host: { type: string }
        port: { type: integer }
        tls: { type: string, enum: [starttls, implicit, 'off'] }
        fromAddress: { type: string }
        fromName: { type: string }
        authConfigured: { type: boolean }
        source: { type: string, enum: [environment] }
        hints: { type: array, items: { $ref: '#/components/schemas/MailHint' } }
    MailCheckCertificate:
      type: object
      required: [validFrom, validUntil, daysLeft, hostnameMatches]
      properties:
        subject: { type: string }
        issuer: { type: string }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        daysLeft: { type: integer }
        hostnameMatches: { type: boolean }
    MailCheckProblem:
      type: object
      required: [code, message, advice]
      properties: { code: { type: string }, message: { type: string }, advice: { type: string } }
    MailCheckStep:
      type: object
      required: [id, title, status, durationMs, details, warnings]
      properties:
        id: { type: string, enum: [dns, tcp, tls, ehlo, auth, mailFrom] }
        title: { type: string }
        status: { type: string, enum: [ok, failed, skipped] }
        durationMs: { type: integer }
        details: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        certificate: { $ref: '#/components/schemas/MailCheckCertificate' }
        problem: { $ref: '#/components/schemas/MailCheckProblem' }
    MailCheckResult:
      type: object
      required: [ok, summary, checkedAt, totalMs, steps]
      properties:
        ok: { type: boolean }
        summary: { type: string }
        checkedAt: { type: string, format: date-time }
        totalMs: { type: integer }
        steps: { type: array, items: { $ref: '#/components/schemas/MailCheckStep' } }
    MailTestInput:
      type: object
