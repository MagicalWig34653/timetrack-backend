          required: [id, createdAt]
          properties: { id: { type: string, format: uuid }, createdAt: { type: string, format: date-time }, version: { type: integer, minimum: 1, description: 'Korrekturzähler (M1); ältere Versionen ohne Wert zählen als 1' } }
    WorkModelPreview:
      type: object
      required: [affectedDays, balanceBeforeSeconds, balanceAfterSeconds, differenceSeconds, changedFields]
      properties:
        affectedFrom: { type: [string, 'null'], format: date }
        affectedTo: { type: [string, 'null'], format: date, description: null = laufend }
        affectedDays: { type: integer, minimum: 0, description: Kalendertage von affectedFrom bis heute }
        balanceBeforeSeconds: { type: integer }
        balanceAfterSeconds: { type: integer }
        differenceSeconds: { type: integer }
        changedFields: { type: array, items: { type: string } }
        previousValidTo: { type: [string, 'null'], format: date, description: neues Ende der Vorversion, falls angepasst }
    PlaceInput:
      type: object
      required: [name, kind, automationMode]
      properties:
        name: { type: string, maxLength: 80 }
        kind: { type: string, enum: [office, home, customer, school, other] }
        automationMode: { type: string, enum: [direct, suggest, off] }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
        radiusMeters: { type: [integer, 'null'], minimum: 20 }
        confirmAfterSeconds: { type: integer, minimum: 0, default: 300 }
