openapi: 3.1.0
info:
  title: Timetrack API
  version: 0.10.5
  description: |
    Vertrag Etappe 1 (Konten, Passkeys, Einladungen, Recovery). Maßgeblich für Backend (C1/C2) und
    PWA (L1). Änderungen nur koordiniert durch den Lead (siehe docs/ARBEITSPLAN.md).
    Annahmen (ADR-0003): Basispfad /api/v1; Sitzung per HttpOnly-Cookie `tt_session`;
    schreibende Requests mit Sitzung senden Header `X-CSRF-Token` (Wert aus GET /api/v1/auth/session).
    WebAuthn-Optionen/-Antworten folgen den JSON-Formen der W3C-Spezifikation (base64url-Felder).
    Fehler immer als application/json `{ "error": { "code": string, "message": string } }`.
    Antworten verraten nie, ob eine Kontoadresse existiert.
    Error codes (English, stable): bad_request, unauthorized, forbidden, not_found, conflict, handle_taken,
    last_passkey, too_many_requests, not_implemented, invalid_code, csrf_invalid,
    recovery_session_restricted, reauth_required, not_ready.
    Decisions (Lead, 14.10.2026): (1) register/options returns 409 handle_taken for duplicate handle and 400 bad_request
    for validation errors. (2) Adding/revoking passkeys and changing recovery settings require a "fresh" session
    (login within the last 10 minutes) or a recovery session; otherwise 403 reauth_required, and the client signs in again.
    (3) A successful POST /me/passkeys/verify inside a recovery session upgrades it to a normal session (recovery=false).
    (4) DELETE /auth/session is allowed in recovery sessions. (5) Invitation links have the form
    `<PUBLIC_BASE_URL>/invite/<token>`; `App bootstrap-admin` prints exactly this form.
    (6) No session listing endpoint in stage 1; only revoking other sessions.
    v0.10.4: GET /.well-known/apple-app-site-association (additiv, ADR-0015; 404 ohne APPLE_APP_IDS). Native Apple-Passkeys melden den Origin `https://<rpId>` (ohne Port); das Backend akzeptiert ihn zusätzlich zu WEBAUTHN_ORIGIN (exakter Abgleich, RP-ID-Hash unverändert), sofern die RP-ID eine echte Domain ist.
    v0.10.3: ImportResult.warnings (additiv, wie in der Vorschau); school_on_holiday für Schulzeilen an Feiertagen neben holiday_times_discarded für Arbeitszeilen.
    v0.10.2: Import-Profil: holidayTimes/partialCredit, Warnungen holiday_times_discarded/credit_partial_as_work (zusammengefasst mit count), Vorschau sheetBalanceUpToTodaySeconds/sheetBalanceFutureSeconds/firstContentDate (Befund L20: Abweichung Tabelle/App erklärt sich aus Feiertagszeilen, Teilgutschriften, Modellbeginn und Zeilen nach heute).
    v0.10.1: Klarstellungen C21: rules leer = keine Regeln; Vorschau-warnings (pause_exceeds_day); Zeilenfehler planning_disabled (Abwesenheits-/Feiertagsaktionen bei ausgeschaltetem Modul planning, Arbeit/Schule bleiben importierbar); ImportResult.conflictItems; Notizen über 500 bzw. Feiertagsnamen über 80 Zeichen → note_too_long (keine stille Kürzung). Export worktime-xlsx ist kein verlustfreies Sicherungsformat (siehe docs/handoffs/C22.md).
    v0.10.0: Arbeitszeit-Tabelle als Import-/Exportprofil und Typ excused (ADR-0013).
    v0.9.0: Modulschalter (ADR-0012). Abgeschaltete Module antworten 404 mit Code module_disabled, Änderungen an gesperrten Modulen 409 module_locked. Betreiber-Override per Umgebung MODULES_DISABLED.
    v0.8.1: C19-Review-Fixes: DELETE /files/{id} → 503 storage_unavailable, wenn das Objekt nicht entfernt werden konnte (Datensatz bleibt mit Retry-Marker); POST /oauth/token → 429 temporarily_unavailable bei Überschreitung des Limits; Push-Endpunkte nur https:443 auf erlaubten Push-Diensten (Apple/Google/Mozilla/Microsoft), sonst 400 bad_request; Datums- und Zahlenbereiche strikt validiert (Int.min/Int.max → 400).
    v0.8.0: Hinweise/Web Push (ADR-0010). Push-Nutzlast ohne Details, Ruhezeiten stellen Push zurück; REST-Fehlercodes: push_unavailable (501), too_many_subscriptions (409).
    v0.7.0: MCP/OAuth/persönliche Tokens (ADR-0009). Fehlercodes REST: reauth_required, insufficient_scope; OAuth-Endpunkte folgen RFC 6749/7009/7591/8414/9728 (Fehler als JSON `error`/`error_description`).
    v0.6.0: Berichtsheft (ADR-0008). Fehlercodes: stale_version (412), not_found; Quellen mit fileId benötigen eine eigene Datei (404 sonst).
    v0.5.1: Speicher: 503 storage_unavailable (Backend einer bestehenden Datei nicht konfiguriert), 500 storage_corrupt, 409 conflict bei mehr als 20 Anhängen je Abwesenheit; PUT /admin/storage ersetzt die gesamte Konfiguration (`s3: null` löscht S3-Konfiguration und Secret, `s3` ohne secretAccessKey behält das gespeicherte Secret). OIDC: für purpose=link führen Fehler nach `/settings/identities?oidc_error=<code>`; 'frische Sitzung nötig' ist 403 reauth_required; ungültiges inviteToken bei start = 404; pendingId gilt 10 Minuten (danach 404); der Passkey-Widerruf zählt externe Identitäten als Anmeldemethode.
    v0.5.0: OIDC (optional) siehe ADR-0007. Konfiguration: OIDC_ISSUER, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET (optional), OIDC_NAME, OIDC_SCOPES (Standard `openid email profile`). Kein Pflicht-Authentik; Registrierung weiter nur mit Einladung.
    v0.4.1: Import-Ergänzungen (allowOvernight, errorCount, rolledBack, Fehlercodes unknown_kind/note_too_long/too_many_rows; rollback_conflict liefert conflicts auch oben; je Konto max. 20 offene Importe, 50 Vorlagen).
    v0.4.0: Export/Import/Dateispeicher, siehe docs/decisions/ADR-0006. Fehlercodes: file_too_large (413), unsupported_type (415), import_not_ready, import_has_errors, rollback_conflict.
    v0.3.2: Tagesmarkierung Feiertag hat Vorrang vor Urlaub am selben Tag; Krankheit wirkt nur mit Status approved/taken; Freigabe an sich selbst 400 `cannot_share_with_self`; DayEvaluation.markSource/targetOverrideSeconds.
    Stage 3 (v0.3.0/0.3.1): see docs/decisions/ADR-0005 (Entscheidungen 0.3.1: GET vacation/settings liefert Standardwerte mit configured=false; Übertrag je Jahr; Abwesenheiten rejected/cancelled blockieren keine Überlappung
    und haben countedHalfDays 0, countedHalfDays nur für kind=vacation; doppelte Freigabe 409 share_exists; Freigabe an sich selbst 400; Urlaubsansicht nur approved/taken; actual nur Tage mit Arbeitszeit;
    maximale Zeiträume für absences/plan/shared view 366 Tage, time/days 93 Tage, sonst 400 range_too_large). Half days as integers (30 days = 60). Sick absences and documents are never part of shares.
    Stage 2 decisions (v0.2.1): a work model `validFrom` may lie in the past but must be later than the previous version's `validFrom` (else 409 model_overlap);
    days on or after it are then evaluated by the new version (explicit user act). Future days are never `provisional`; today and days with a running segment are.
    A second accept of a suggestion returns 409 `suggestion_resolved`. Further codes: timer_already_running, no_running_timer, segment_overlap, stale_version, model_overlap.
    --- B2 (v0.10.5, additiv; eigene Zeile, damit der Merge mit v0.11.0 einfach bleibt) ---
    v0.10.5 (B2, ADR-0017): POST /api/v1/me/push-subscriptions/replace für `pushsubscriptionchange` (ersetzt ein Abo atomar, behält Id und wartende Pushes). Gleichzeitiges Anlegen desselben Lernfelds liefert 409 `learning_field_exists` statt 500. Kein Schemawechsel; Aufräumjob (`MAINTENANCE_INTERVAL_MINUTES`, CLI `maintenance`) ohne API-Änderung.
servers:
  - url: /
paths:
  /health:
    get:
      operationId: health
      description: Prozess-Liveness, ohne Datenbank.
      responses:
        '200':
          description: Prozess antwortet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
  /.well-known/apple-app-site-association:
    get:
      operationId: appleAppSiteAssociation
      description: |
        Associated Domains für native Passkeys (ADR-0015). Öffentlich, ohne Sitzung/CSRF, ohne Weiterleitung.
        Inhalt aus der Umgebungsvariable APPLE_APP_IDS (kommagetrennt, `<TeamID>.<BundleID>`); ohne Einträge 404.
        Native Clients senden in clientDataJSON den Origin `https://<rpId>` (ohne Port), der zusätzlich zu WEBAUTHN_ORIGIN
        akzeptiert wird (exakter Abgleich, nur bei RP-ID mit Punkt).
      security: []
      responses:
        '200':
          description: AASA-Datei
          content:
            application/json:
              schema:
                type: object
                required: [webcredentials]
                properties:
                  webcredentials:
                    type: object
                    required: [apps]
                    properties:
                      apps: { type: array, items: { type: string, example: ABCDE12345.com.example.timetrack } }
        '404': { description: APPLE_APP_IDS nicht gesetzt, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /ready:
    get:
      operationId: ready
      description: Readiness inklusive Datenbankverbindung und angewendeter Migrationen.
      responses:
        '200': { description: bereit, content: { application/json: { schema: { $ref: '#/components/schemas/Status' } } } }
        '503': { description: nicht bereit, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/invitations/{token}:
    get:
      operationId: inspectInvitation
      description: Prüft, ob ein Einladungstoken gültig ist (ohne Details zum Einladenden).
      parameters: [ { name: token, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: gültig
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid: { type: boolean, const: true }
                  expiresAt: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/auth/register/options:
    post:
      operationId: registerOptions
      description: Startet Registrierung per Einladung; liefert WebAuthn-Creation-Options.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteToken, handle, displayName]
              properties:
                inviteToken: { type: string }
                handle: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{2,31}$', description: eindeutige Kontokennung (Kleinbuchstaben); dient als Recovery-Identifier }
                displayName: { type: string, minLength: 1, maxLength: 80 }
                email: { type: string, format: email, description: optional; unverifiziert bis Bestätigung }
      responses:
        '200':
          description: Challenge erzeugt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreationOptions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooMany' }
  /api/v1/auth/register/verify:
    post:
      operationId: registerVerify
      description: |
        Prüft die Attestation und legt Konto, ersten Passkey und Sitzung atomar an; verbraucht die
        Einladung genau einmal (paralleles Einlösen: genau ein Erfolg).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, credential]
              properties:
                challengeId: { type: string }
                credential: { $ref: '#/components/schemas/RegistrationCredential' }
                passkeyName: { type: string, maxLength: 80 }
      responses:
        '201':
          description: Konto angelegt; Set-Cookie tt_session
          content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/auth/login/options:
    post:
      operationId: loginOptions
      description: Startet Anmeldung (discoverable credentials, keine Kontoangabe nötig).
      responses:
        '200':
          description: Challenge erzeugt
          content: { application/json: { schema: { $ref: '#/components/schemas/RequestOptions' } } }
        '429': { $ref: '#/components/responses/TooMany' }
  /api/v1/auth/login/verify:
    post:
      operationId: loginVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, credential]
              properties:
                challengeId: { type: string }
                credential: { $ref: '#/components/schemas/AuthenticationCredential' }
      responses:
        '200':
          description: angemeldet; Set-Cookie tt_session
          content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/session:
    get:
      operationId: currentSession
      description: Aktuelle Sitzung samt CSRF-Token und Konto.
      security: [ { session: [] } ]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: logout
      security: [ { session: [], csrf: [] } ]
      responses:
        '204': { description: Sitzung beendet }
  /api/v1/me/passkeys:
    get:
      operationId: listPasskeys
      security: [ { session: [] } ]
      responses:
        '200':
          description: Passkeys des eigenen Kontos
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Passkey' } }
  /api/v1/me/passkeys/options:
    post:
      operationId: addPasskeyOptions
      description: Weiteren Passkey hinzufügen; erfordert frische Authentisierung oder Recovery-Sitzung.
      security: [ { session: [], csrf: [] } ]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/CreationOptions' } } } }
  /api/v1/me/passkeys/verify:
    post:
      operationId: addPasskeyVerify
      security: [ { session: [], csrf: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, credential]
              properties:
                challengeId: { type: string }
                credential: { $ref: '#/components/schemas/RegistrationCredential' }
                passkeyName: { type: string, maxLength: 80 }
      responses:
        '201': { description: hinzugefügt, content: { application/json: { schema: { $ref: '#/components/schemas/Passkey' } } } }
  /api/v1/me/passkeys/{id}:
    patch:
      operationId: renamePasskey
      security: [ { session: [], csrf: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 80 } } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Passkey' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: revokePasskey
      description: Widerruft einen Passkey. Der letzte Passkey kann nur widerrufen werden, wenn eine Recovery-Methode aktiv ist.
      security: [ { session: [], csrf: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '204': { description: widerrufen }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/me/recovery:
    get:
      operationId: recoveryStatus
      security: [ { session: [] } ]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryStatus' } } } }
  /api/v1/me/recovery/recovery-codes:
    post:
      operationId: generateRecoveryCodes
      description: Erzeugt einen neuen Satz Recovery-Codes (invalidiert den alten). Klartext nur in dieser Antwort.
      security: [ { session: [], csrf: [] } ]
      responses:
        '201':
          description: Codes
          content:
            application/json:
              schema:
                type: object
                required: [codes]
                properties: { codes: { type: array, items: { type: string } } }
    delete:
      operationId: disableRecoveryCodes
      security: [ { session: [], csrf: [] } ]
      responses: { '204': { description: deaktiviert } }
  /api/v1/me/recovery/fallback-password:
    put:
      operationId: setFallbackPassword
      description: Setzt oder ersetzt das Rückfallpasswort (nur für Recovery, nie für normale Anmeldung).
      security: [ { session: [], csrf: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string, minLength: 12, maxLength: 256 } } } } }
      responses: { '204': { description: gesetzt }, '400': { $ref: '#/components/responses/BadRequest' } }
    delete:
      operationId: removeFallbackPassword
      security: [ { session: [], csrf: [] } ]
      responses: { '204': { description: entfernt } }
  /api/v1/me/recovery/email:
    put:
      operationId: enableEmailRecovery
      description: Startet Verifikation der Adresse; 409/501 wenn Server ohne Mailversand konfiguriert ist.
      security: [ { session: [], csrf: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } }
      responses: { '202': { description: Verifikationscode versendet }, '501': { $ref: '#/components/responses/NotImplemented' } }
    delete:
      operationId: disableEmailRecovery
      security: [ { session: [], csrf: [] } ]
      responses: { '204': { description: deaktiviert } }
  /api/v1/me/recovery/email/verify:
    post:
      operationId: verifyRecoveryEmail
      security: [ { session: [], csrf: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses: { '204': { description: verifiziert und aktiv }, '400': { $ref: '#/components/responses/BadRequest' } }
  /api/v1/auth/recovery/start:
    post:
      operationId: recoveryStart
      description: |
        Startet Wiederherstellung. Antwort ist für unbekannte Konten und gültige Konten gleich (202),
        um Kontoexistenz nicht zu verraten. Methode `email` sendet einen Code (falls aktiv), `recovery-code`
        und `fallback-password` erwarten Nachweis in /complete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, identifier]
              properties:
                method: { type: string, enum: [email, recovery-code, fallback-password] }
                identifier: { type: string, description: Konto-`handle` }
      responses:
        '202': { description: angenommen, content: { application/json: { schema: { type: object, required: [recoveryId], properties: { recoveryId: { type: string } } } } } }
        '429': { $ref: '#/components/responses/TooMany' }
  /api/v1/auth/recovery/complete:
    post:
      operationId: recoveryComplete
      description: |
        Prüft Nachweis (Code bzw. Passwort) atomar und einmalig; eröffnet eine kurzlebige Recovery-Sitzung
        (Cookie tt_session mit Flag recovery=true), die nur das Einrichten eines neuen Passkeys und
        Sitzungswiderruf erlaubt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recoveryId, proof]
              properties:
                recoveryId: { type: string }
                proof: { type: string }
      responses:
        '200': { description: Recovery-Sitzung, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooMany' }
  /api/v1/me/sessions:
    delete:
      operationId: revokeOtherSessions
      description: Widerruft alle anderen Sitzungen des Kontos.
      security: [ { session: [], csrf: [] } ]
      responses: { '204': { description: widerrufen } }
  /api/v1/admin/invitations:
    get:
      operationId: listInvitations
      security: [ { session: [] } ]
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Invitation' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createInvitation
      description: Erzeugt eine Einladung; Klartext-Token nur in dieser Antwort (Server speichert nur den Hash).
      security: [ { session: [], csrf: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresInHours: { type: integer, minimum: 1, maximum: 720, default: 72 }
                note: { type: string, maxLength: 200 }
      responses:
        '201': { description: erzeugt, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationCreated' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/invitations/{id}:
    delete:
      operationId: revokeInvitation
      security: [ { session: [], csrf: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { '204': { description: widerrufen }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/work-models:
    get:
      operationId: listWorkModels
      description: Alle Arbeitsmodell-Versionen des Kontos, nach validFrom sortiert.
      security: [ { session: [] } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/WorkModel' } } } } } }
    post:
      operationId: createWorkModel
      description: Legt eine neue Modellversion an. Eine laufende Vorversion wird am Vortag von validFrom beendet; Vergangenheit wird nie verändert (409 model_overlap bei Überschneidung mit späteren Versionen).
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkModelInput' } } } }
      responses: { '201': { description: angelegt, content: { application/json: { schema: { $ref: '#/components/schemas/WorkModel' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/work-models/{id}:
    get:
      operationId: getWorkModel
      security: [ { session: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/WorkModel' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      operationId: endWorkModel
      description: Setzt nur validTo (z. B. Ausbildungsende). Weitere Felder sind unveränderlich; neue Regeln = neue Version.
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [validTo], properties: { validTo: { type: string, format: date } } } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/WorkModel' } } } }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/places:
    get:
      operationId: listPlaces
      security: [ { session: [] } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Place' } } } } } }
    post:
      operationId: createPlace
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlaceInput' } } } }
      responses: { '201': { description: angelegt, content: { application/json: { schema: { $ref: '#/components/schemas/Place' } } } } }
  /api/v1/places/{id}:
    put:
      operationId: updatePlace
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlaceInput' } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Place' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      operationId: archivePlace
      description: Archiviert den Ort (bestehende Segmente behalten ihre Referenz).
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: archiviert }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/time/segments:
    get:
      operationId: listSegments
      description: Segmente, deren Beginn in [from, to) (UTC-Instants) liegt; Rohzeiten und Revisionsanzahl enthalten, stornierte nur mit includeVoided.
      security: [ { session: [] } ]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: includeVoided, in: query, schema: { type: boolean, default: false } }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Segment' } } } } } }
    post:
      operationId: createSegment
      description: Manueller Eintrag (abgeschlossen oder, ohne endedAt, laufend). Überschneidung mit anderem Segment → 409 segment_overlap.
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SegmentInput' } } } }
      responses: { '201': { description: angelegt, content: { application/json: { schema: { $ref: '#/components/schemas/Segment' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/time/segments/{id}:
    get:
      operationId: getSegment
      security: [ { session: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Segment' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      operationId: correctSegment
      description: Korrektur mit Pflichtgrund; If-Match muss die aktuelle version enthalten (sonst 412 stale_version). Rohzeiten bleiben erhalten, es entsteht eine Revision.
      security: [ { session: [], csrf: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SegmentCorrection' } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Segment' } } } }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '412': { description: veraltete Version, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
    delete:
      operationId: voidSegment
      description: Storniert das Segment (Soft-Delete mit Grund im Query `reason`); Rohdaten bleiben.
      security: [ { session: [], csrf: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: reason, in: query, required: true, schema: { type: string, maxLength: 200 } }
      responses: { '204': { description: storniert }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/time/timer:
    get:
      operationId: currentTimer
      security: [ { session: [] } ]
      responses: { '200': { description: laufendes Segment oder null, content: { application/json: { schema: { oneOf: [ { $ref: '#/components/schemas/Segment' }, { type: 'null' } ] } } } } }
  /api/v1/time/timer/start:
    post:
      operationId: startTimer
      description: Idempotent über clientEventId. Läuft bereits ein anderes Segment → 409 timer_already_running.
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [clientEventId], properties: { clientEventId: { type: string, format: uuid }, kind: { $ref: '#/components/schemas/SegmentKind' }, placeId: { type: [string, 'null'], format: uuid } } } } } }
      responses: { '200': { description: gestartet oder bereits durch dieses Ereignis gestartet, content: { application/json: { schema: { $ref: '#/components/schemas/Segment' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/time/timer/stop:
    post:
      operationId: stopTimer
      description: Idempotent über clientEventId; ohne laufendes Segment und ohne früheres Ereignis → 409 no_running_timer.
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [clientEventId], properties: { clientEventId: { type: string, format: uuid } } } } } }
      responses: { '200': { description: gestoppt, content: { application/json: { schema: { $ref: '#/components/schemas/Segment' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/time/days:
    get:
      operationId: listDayEvaluations
      description: Bewertungen für lokale Tage von..bis (max. 93 Tage), einschließlich Tagen ohne Segmente (Soll/Markierung).
      security: [ { session: [] } ]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DayEvaluation' } } } } } }
  /api/v1/time/days/{date}:
    get:
      operationId: getDayEvaluation
      security: [ { session: [] } ]
      parameters: [ { name: date, in: path, required: true, schema: { type: string, format: date } } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/DayEvaluation' } } } } }
    put:
      operationId: setDayPreferences
      description: Tagesmarkierung und/oder Überspringen fester Pausen setzen (leere Markierung `none` entfernt sie).
      security: [ { session: [], csrf: [] } ]
      parameters: [ { name: date, in: path, required: true, schema: { type: string, format: date } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { mark: { $ref: '#/components/schemas/DayMarkKind' }, creditSeconds: { type: [integer, 'null'], minimum: 0 }, skipFixedBreaks: { type: boolean }, note: { type: [string, 'null'], maxLength: 200 } } } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/DayEvaluation' } } } } }
  /api/v1/time/account:
    get:
      operationId: getTimeAccount
      description: Zeitkontosaldo bis einschließlich asOf (Standard heute); heutiger Tag ist vorläufig.
      security: [ { session: [] } ]
      parameters: [ { name: asOf, in: query, schema: { type: string, format: date } } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/TimeAccount' } } } } }
  /api/v1/time/account/adjustments:
    post:
      operationId: createAccountAdjustment
      description: Anfangsstand (kind=opening, höchstens einer, setzt accountStart) oder datierte Korrektur.
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [kind, date, seconds, reason], properties: { kind: { type: string, enum: [opening, correction] }, date: { type: string, format: date }, seconds: { type: integer }, reason: { type: string, maxLength: 200 } } } } } }
      responses: { '201': { description: angelegt, content: { application/json: { schema: { $ref: '#/components/schemas/TimeAccount' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/time/suggestions:
    get:
      operationId: listSuggestions
      security: [ { session: [] } ]
      responses: { '200': { description: offene Vorschläge, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Suggestion' } } } } } }
  /api/v1/time/suggestions/{id}/accept:
    post:
      operationId: acceptSuggestion
      description: Erzeugt aus dem Vorschlag ein Segment bzw. beendet das offene (Zeiten optional überschreibbar). Einmalig; zweites Mal → 409.
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { startedAt: { type: string, format: date-time }, endedAt: { type: string, format: date-time } } } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Segment' } } } }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/time/suggestions/{id}/reject:
    post:
      operationId: rejectSuggestion
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: verworfen }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/me/device-tokens:
    get:
      operationId: listDeviceTokens
      security: [ { session: [] } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DeviceToken' } } } } } }
    post:
      operationId: createDeviceToken
      description: Erzeugt ein Gerätetoken (nur Automation-Scope). Klartext nur in dieser Antwort.
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 80 }, expiresInDays: { type: integer, minimum: 1, maximum: 730 } } } } } }
      responses: { '201': { description: erzeugt, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/DeviceToken' }, { type: object, required: [token], properties: { token: { type: string } } } ] } } } } }
  /api/v1/me/device-tokens/{id}:
    delete:
      operationId: revokeDeviceToken
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: widerrufen }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/automation/events:
    post:
      operationId: postAutomationEvent
      description: |
        Für Shortcuts. Auth: `Authorization: Bearer <device token>` (kein Cookie/CSRF). Idempotent über eventId; ein Duplikat liefert das erste Ergebnis.
        Ergebnis je nach Ortsmodus: `booked`, `suggested`, `ignored`, `recorded` (nur festgehalten), `duplicate`, `needs_review`.
      security: [ { deviceToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AutomationEvent' } } } }
      responses:
        '200': { description: verarbeitet, content: { application/json: { schema: { type: object, required: [result], properties: { result: { type: string, enum: [booked, suggested, ignored, recorded, duplicate, needs_review] }, segmentId: { type: [string, 'null'], format: uuid }, suggestionId: { type: [string, 'null'], format: uuid } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/vacation/settings:
    get:
      operationId: getVacationSettings
      security: [ { session: [] } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/VacationSettings' } } } } }
    put:
      operationId: putVacationSettings
      description: Region, Jahresanspruch und Übertragsregel. Standard laut ADR-0005 (Annahme für Onboarding) 30 Tage und Region DE-ST.
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VacationSettings' } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/VacationSettings' } } } } }
  /api/v1/vacation/snapshots:
    post:
      operationId: createVacationSnapshot
      description: Stichtagsbestand (Resturlaub zu einem Datum). Ersetzt die davor liegende Kontohistorie; Verbrauch/Anspruch zählen erst ab dem Stichtag.
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [date, remainingHalfDays], properties: { date: { type: string, format: date }, remainingHalfDays: { type: integer, minimum: 0 } } } } } }
      responses: { '201': { description: angelegt, content: { application/json: { schema: { $ref: '#/components/schemas/VacationBalance' } } } } }
  /api/v1/vacation/adjustments:
    post:
      operationId: createVacationAdjustment
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [date, halfDays, reason], properties: { date: { type: string, format: date }, halfDays: { type: integer }, reason: { type: string, maxLength: 200 } } } } } }
      responses: { '201': { description: angelegt, content: { application/json: { schema: { $ref: '#/components/schemas/VacationBalance' } } } } }
  /api/v1/vacation/balance:
    get:
      operationId: getVacationBalance
      description: Kontostand für ein Urlaubsjahr (Kalenderjahr). available = Anspruch + Übertrag + Korrekturen − gebucht(genehmigt/genommen); geplant/beantragt separat, `availableAfterPlanned` als Vorschau.
      security: [ { session: [] } ]
      parameters: [ { name: year, in: query, required: true, schema: { type: integer } } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/VacationBalance' } } } } }
  /api/v1/vacation/entries:
    get:
      operationId: listVacationEntries
      description: Stichtagsbestände und Korrekturen mit IDs.
      security: [ { session: [] } ]
      parameters: [ { name: year, in: query, required: true, schema: { type: integer } } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: object, required: [snapshots, adjustments], properties: { snapshots: { type: array, items: { type: object, required: [id, date, remainingHalfDays], properties: { id: { type: string, format: uuid }, date: { type: string, format: date }, remainingHalfDays: { type: integer } } } }, adjustments: { type: array, items: { type: object, required: [id, date, halfDays, reason], properties: { id: { type: string, format: uuid }, date: { type: string, format: date }, halfDays: { type: integer }, reason: { type: string } } } } } } } } } }
  /api/v1/vacation/entries/{id}:
    delete:
      operationId: deleteVacationEntry
      description: Löscht einen Stichtagsbestand oder eine Korrektur (eigene ID).
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: gelöscht }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/absences:
    get:
      operationId: listAbsences
      security: [ { session: [] } ]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Absence' } } } } } }
    post:
      operationId: createAbsence
      description: Urlaub/Krankheit/sonstige Abwesenheit. Überlappung mit anderer Abwesenheit → 409 absence_overlap. Verbrauch in halben Tagen nur an Arbeitstagen des Modells, nicht an Feiertagen.
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AbsenceInput' } } } }
      responses: { '201': { description: angelegt, content: { application/json: { schema: { $ref: '#/components/schemas/Absence' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/absences/{id}:
    get:
      operationId: getAbsence
      security: [ { session: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Absence' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      operationId: updateAbsence
      description: Ändert Zeitraum/Status; Statuswechsel zählt Tage nie doppelt (genehmigt→genommen). If-Match auf version.
      security: [ { session: [], csrf: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AbsenceInput' } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Absence' } } } }, '404': { $ref: '#/components/responses/NotFound' }, '412': { description: veraltete Version, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
    delete:
      operationId: deleteAbsence
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: gelöscht }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/calendar/holidays:
    get:
      operationId: listHolidays
      description: Gesetzliche Feiertage der eingestellten Region (fest eingebaut, DE inkl. Bundesländer) plus eigene Einträge; Schulferien nur als vom Nutzer erfasste Zeiträume.
      security: [ { session: [] } ]
      parameters:
        - { name: year, in: query, required: true, schema: { type: integer } }
        - { name: region, in: query, schema: { type: string, description: ISO 3166-2, z. B. DE-ST; Standard aus Einstellungen } }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CalendarDay' } } } } } }
  /api/v1/calendar/custom-days:
    post:
      operationId: createCustomCalendarDay
      description: Eigener Feiertag/Brückentag oder Schulferien-Zeitraum.
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [kind, startDate, endDate, name], properties: { kind: { type: string, enum: [holiday, school_holiday] }, startDate: { type: string, format: date }, endDate: { type: string, format: date }, name: { type: string, maxLength: 80 } } } } } }
      responses: { '201': { description: angelegt, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarDay' } } } } }
  /api/v1/calendar/custom-days/{id}:
    delete:
      operationId: deleteCustomCalendarDay
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: gelöscht }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/plan/days:
    get:
      operationId: listPlanDays
      description: Geplante Arbeitsform je Tag (Büro/HO/Kunde/Schule/frei) für den Zeitraum; Urlaub/Feiertage werden im Kalender zusätzlich abgeleitet geliefert.
      security: [ { session: [] } ]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PlanDay' } } } } } }
  /api/v1/plan/days/{date}:
    put:
      operationId: putPlanDay
      security: [ { session: [], csrf: [] } ]
      parameters: [ { name: date, in: path, required: true, schema: { type: string, format: date } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlanDayInput' } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/PlanDay' } } } } }
    delete:
      operationId: deletePlanDay
      security: [ { session: [], csrf: [] } ]
      parameters: [ { name: date, in: path, required: true, schema: { type: string, format: date } } ]
      responses: { '204': { description: gelöscht } }
  /api/v1/shares:
    get:
      operationId: listShares
      description: Eigene ausgehende Freigaben.
      security: [ { session: [] } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Share' } } } } } }
    post:
      operationId: createShare
      description: Freigabe an ein anderes Konto derselben Instanz (Empfänger per handle), je Umfang plan/actual/vacation getrennt, nur lesend, standardmäßig nichts geteilt. Unbekannter Empfänger → 404 recipient_not_found (Annahme; kleine Instanz).
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [recipientHandle, scopes], properties: { recipientHandle: { type: string }, scopes: { $ref: '#/components/schemas/ShareScopes' } } } } } }
      responses: { '201': { description: angelegt, content: { application/json: { schema: { $ref: '#/components/schemas/Share' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/shares/{id}:
    patch:
      operationId: updateShare
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [scopes], properties: { scopes: { $ref: '#/components/schemas/ShareScopes' } } } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Share' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      operationId: revokeShare
      description: Widerruft sofort; neue Abrufe liefern 404.
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: widerrufen }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/shares/incoming:
    get:
      operationId: listIncomingShares
      security: [ { session: [] } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/IncomingShare' } } } } } }
  /api/v1/shares/incoming/{shareId}/view:
    get:
      operationId: viewShared
      description: |
        Begrenzte Ansicht für den Empfänger. Je freigegebenem Scope: plan = geplante Arbeitsform je Tag ohne Notizen; actual = nur bewertete Beginn/Ende und Dauer je Tag, keine Orte/Notizen/Segmente;
        vacation = nur als Urlaub erkennbare Abwesenheiten (Zeiträume), niemals Krankheit/Unterlagen/Notizen. Nicht freigegebene Scopes fehlen. Widerrufen/fremd → 404.
      security: [ { session: [] } ]
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/SharedView' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/export/time:
    get:
      operationId: exportTime
      description: Arbeitszeitexport (siehe ADR-0006). Antwort ist eine Datei mit Content-Disposition attachment.
      security: [ { session: [] } ]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: format, in: query, required: true, schema: { type: string, enum: [xlsx, pdf, csv, worktime-xlsx] }, description: worktime-xlsx = Arbeitszeit-Tabelle im Jahresblatt-Format (ADR-0013) }
        - { name: times, in: query, schema: { type: string, enum: [evaluated, actual], default: evaluated }, description: nur worktime-xlsx }
        - { name: pauseMinutes, in: query, schema: { type: integer, minimum: 0, maximum: 240 }, description: nur worktime-xlsx }
        - { name: standardStart, in: query, schema: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', default: '08:00' }, description: nur worktime-xlsx }
        - { name: dateSystem, in: query, schema: { type: string, enum: ['1900', '1904'], default: '1900' }, description: nur worktime-xlsx }
      responses:
        '200': { description: Datei, content: { application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }, application/pdf: { schema: { type: string, format: binary } }, text/csv: { schema: { type: string } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/imports:
    post:
      operationId: uploadImport
      description: Lädt eine CSV- oder XLSX-Datei (multipart/form-data, Feld file) hoch. Es werden noch keine Zeiten angelegt.
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } } }
      responses: { '201': { description: hochgeladen, content: { application/json: { schema: { $ref: '#/components/schemas/ImportJob' } } } }, '400': { $ref: '#/components/responses/BadRequest' } }
  /api/v1/imports/{id}:
    get:
      operationId: getImport
      security: [ { session: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ImportJob' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      operationId: discardImport
      description: Verwirft einen noch nicht übernommenen Import samt hochgeladener Datei.
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: verworfen }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/imports/{id}/preview:
    get:
      operationId: previewImportRows
      description: Rohvorschau (erste 50 Zeilen des Blatts) zur Wahl von Kopfzeile und Spalten.
      security: [ { session: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: sheet, in: query, schema: { type: string } }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: object, required: [sheet, rows], properties: { sheet: { type: string }, rows: { type: array, items: { type: array, items: { type: [string, 'null'] } } } } } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/imports/{id}/mapping:
    put:
      operationId: putImportMapping
      description: Speichert die Zuordnung und liefert die Validierungsvorschau (noch keine Übernahme).
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ImportMapping' } } } }
      responses: { '200': { description: Vorschau, content: { application/json: { schema: { $ref: '#/components/schemas/ImportPreview' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/imports/{id}/commit:
    post:
      operationId: commitImport
      description: Übernimmt die zuletzt validierte Zuordnung in einer Transaktion. Wiederholung derselben Datei erzeugt keine Duplikate (skipped). Nur wenn keine Zeilenfehler bestehen oder ignoreErrors=true.
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { ignoreErrors: { type: boolean, default: false } } } } } }
      responses: { '200': { description: übernommen, content: { application/json: { schema: { $ref: '#/components/schemas/ImportResult' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/imports/{id}/rollback:
    post:
      operationId: rollbackImport
      description: Nimmt eine übernommene Charge zurück (storniert deren Segmente), sofern sie seitdem unverändert sind; sonst 409 mit Konfliktliste.
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: zurückgenommen, content: { application/json: { schema: { $ref: '#/components/schemas/ImportResult' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/import-templates:
    get:
      operationId: listImportTemplates
      security: [ { session: [] } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ImportTemplate' } } } } } }
    post:
      operationId: createImportTemplate
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, mapping], properties: { name: { type: string, maxLength: 80 }, mapping: { $ref: '#/components/schemas/ImportMapping' } } } } } }
      responses: { '201': { description: angelegt, content: { application/json: { schema: { $ref: '#/components/schemas/ImportTemplate' } } } } }
  /api/v1/import-templates/{id}:
    delete:
      operationId: deleteImportTemplate
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: gelöscht }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/admin/storage:
    get:
      operationId: getStorageSettings
      description: Nur Admin. Geheimnisse werden nie ausgegeben (hasSecret).
      security: [ { session: [] } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/StorageSettings' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
    put:
      operationId: putStorageSettings
      description: Nur Admin. Wirkt nur auf neue Uploads. secretAccessKey wird nur geschrieben, wenn angegeben. Ohne STORAGE_SECRET_KEY auf dem Server → 501 not_implemented bei S3.
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StorageSettingsInput' } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/StorageSettings' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { $ref: '#/components/responses/Forbidden' }, '501': { $ref: '#/components/responses/NotImplemented' } }
  /api/v1/files:
    post:
      operationId: uploadFile
      description: Lädt eine Datei hoch (multipart, Feld file). Speicherort nach Admin-Regeln. Typ-Whitelist und Größenlimit; 413 file_too_large, 415 unsupported_type.
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } } }
      responses: { '201': { description: gespeichert, content: { application/json: { schema: { $ref: '#/components/schemas/FileMeta' } } } }, '400': { $ref: '#/components/responses/BadRequest' } }
  /api/v1/files/{id}:
    get:
      operationId: downloadFile
      description: Nur Eigentümer. Content-Disposition attachment, nosniff.
      security: [ { session: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: Datei, content: { application/octet-stream: { schema: { type: string, format: binary } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      operationId: deleteFile
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: gelöscht }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/absences/{id}/attachments:
    get:
      operationId: listAbsenceAttachments
      security: [ { session: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FileMeta' } } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      operationId: attachFileToAbsence
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [fileId], properties: { fileId: { type: string, format: uuid } } } } } }
      responses: { '201': { description: verknüpft, content: { application/json: { schema: { $ref: '#/components/schemas/FileMeta' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/absences/{id}/attachments/{fileId}:
    delete:
      operationId: detachFileFromAbsence
      security: [ { session: [], csrf: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: fileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '204': { description: Verknüpfung entfernt }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/auth/oidc/config:
    get:
      operationId: oidcConfig
      description: Ob OIDC auf diesem Server konfiguriert ist (OIDC_ISSUER und OIDC_CLIENT_ID). Optional, keine Pflicht.
      responses: { '200': { description: ok, content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean }, name: { type: string, description: Anzeigename des Anbieters } } } } } } }
  /api/v1/auth/oidc/start:
    post:
      operationId: oidcStart
      description: |
        Startet Authorization Code Flow mit PKCE (S256), state und nonce serverseitig gespeichert (10 min, einmalig).
        purpose=login: Anmeldung mit bereits verknüpfter Identität. purpose=link: eingeloggtes Konto verknüpft eine Identität (frische Sitzung nötig). purpose=register: Einladung (inviteToken) mit Identität einlösen.
        Antwort enthält die Anbieter-URL, zu der der Browser navigiert.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [purpose], properties: { purpose: { type: string, enum: [login, link, register] }, inviteToken: { type: string } } } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: object, required: [authorizationUrl], properties: { authorizationUrl: { type: string, format: uri } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /api/v1/auth/oidc/callback:
    get:
      operationId: oidcCallback
      description: |
        Redirect-Ziel des Anbieters (PUBLIC_BASE_URL/api/v1/auth/oidc/callback). Tauscht den Code (PKCE), validiert id_token (Signatur über JWKS, iss, aud, exp, nonce, azp) und wertet die Identität (issuer, sub) aus; E-Mail-Adressen verknüpfen nie automatisch.
        Antwort ist immer ein 302 auf die PWA: login → `/` (Sitzungscookie gesetzt); link → `/settings/identities?linked=1`; register → `/invite/<token>?oidc=<pendingId>` (Konto wird erst mit POST /auth/oidc/register angelegt);
        Fehler → `/login?oidc_error=<code>` mit Codes oidc_not_linked, oidc_state_invalid, oidc_token_invalid, oidc_identity_taken, oidc_invite_invalid, oidc_reauth_required, oidc_failed. Keine Tokens in URLs/Logs.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses: { '302': { description: Weiterleitung zur PWA } }
  /api/v1/auth/oidc/register:
    post:
      operationId: oidcRegister
      description: Schließt die Registrierung per Einladung und OIDC-Identität ab (handle und Anzeigename wählen). Einladung und Identität werden atomar verbraucht; es entsteht ein Konto ohne Passkey, die PWA bietet anschließend die Passkey-Einrichtung an.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [pendingId, handle, displayName], properties: { pendingId: { type: string }, handle: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{2,31}$' }, displayName: { type: string, minLength: 1, maxLength: 80 } } } } } }
      responses: { '201': { description: Konto angelegt; Set-Cookie tt_session, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/me/identities:
    get:
      operationId: listIdentities
      security: [ { session: [] } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ExternalIdentity' } } } } } }
  /api/v1/me/identities/{id}:
    delete:
      operationId: unlinkIdentity
      description: Entfernt die Verknüpfung (frische Sitzung nötig). Nicht möglich, wenn dadurch keine Anmeldemethode (Passkey oder andere Identität) übrig bliebe → 409 last_login_method.
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: entfernt }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/reports/learning-fields:
    get:
      operationId: listLearningFields
      security: [ { session: [] } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LearningField' } } } } } }
    post:
      operationId: createLearningField
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LearningFieldInput' } } } }
      responses: { '201': { description: angelegt, content: { application/json: { schema: { $ref: '#/components/schemas/LearningField' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/reports/learning-fields/{id}:
    put:
      operationId: updateLearningField
      description: Benennt um oder sortiert; bestehende Einträge behalten ihren Namens-Snapshot.
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LearningFieldInput' } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/LearningField' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      operationId: deleteLearningField
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: gelöscht }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/reports/entries:
    post:
      operationId: createReportEntry
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReportEntryInput' } } } }
      responses: { '201': { description: angelegt, content: { application/json: { schema: { $ref: '#/components/schemas/ReportEntry' } } } }, '400': { $ref: '#/components/responses/BadRequest' } }
  /api/v1/reports/entries/{id}:
    put:
      operationId: updateReportEntry
      description: If-Match mit version; sonst 412 stale_version.
      security: [ { session: [], csrf: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReportEntryInput' } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ReportEntry' } } } }, '404': { $ref: '#/components/responses/NotFound' }, '412': { description: veraltete Version, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
    delete:
      operationId: deleteReportEntry
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: gelöscht }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/reports/weeks/{year}/{week}:
    get:
      operationId: getReportWeek
      description: ISO-Woche mit Einträgen, Summen, Status, Quellenanzahl und der bewerteten Arbeitszeit der Woche als Hinweis.
      security: [ { session: [] } ]
      parameters:
        - { name: year, in: path, required: true, schema: { type: integer } }
        - { name: week, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 53 } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ReportWeek' } } } }, '400': { $ref: '#/components/responses/BadRequest' } }
    put:
      operationId: putReportWeekStatus
      security: [ { session: [], csrf: [] } ]
      parameters:
        - { name: year, in: path, required: true, schema: { type: integer } }
        - { name: week, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 53 } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [draft, done] } } } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ReportWeek' } } } } }
  /api/v1/reports/weeks/{year}/{week}/text:
    get:
      operationId: getReportWeekText
      description: Kopierbare Klartextausgabe im Standardformat (ADR-0008), text/plain; charset=utf-8.
      security: [ { session: [] } ]
      parameters:
        - { name: year, in: path, required: true, schema: { type: integer } }
        - { name: week, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 53 } }
      responses: { '200': { description: Text, content: { text/plain: { schema: { type: string } } } } }
  /api/v1/reports/sources:
    get:
      operationId: listReportSources
      security: [ { session: [] } ]
      parameters:
        - { name: year, in: query, required: true, schema: { type: integer } }
        - { name: week, in: query, required: true, schema: { type: integer } }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ReportSource' } } } } } }
    post:
      operationId: createReportSource
      description: Textquelle (note) oder Dateiquelle (fileId aus POST /files).
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReportSourceInput' } } } }
      responses: { '201': { description: angelegt, content: { application/json: { schema: { $ref: '#/components/schemas/ReportSource' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/reports/sources/{id}:
    delete:
      operationId: deleteReportSource
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: gelöscht }, '404': { $ref: '#/components/responses/NotFound' } }
  /.well-known/oauth-protected-resource:
    get:
      operationId: oauthProtectedResource
      description: RFC 9728 Metadaten der MCP-Ressource.
      responses: { '200': { description: ok, content: { application/json: { schema: { type: object, required: [resource, authorization_servers], properties: { resource: { type: string }, authorization_servers: { type: array, items: { type: string } }, scopes_supported: { type: array, items: { type: string } }, bearer_methods_supported: { type: array, items: { type: string } } } } } } } }
  /.well-known/oauth-authorization-server:
    get:
      operationId: oauthAuthorizationServer
      description: RFC 8414 Metadaten (issuer = PUBLIC_BASE_URL, PKCE S256, public clients, code + refresh_token).
      responses: { '200': { description: ok, content: { application/json: { schema: { type: object } } } } }
  /oauth/register:
    post:
      operationId: oauthRegister
      description: Dynamic Client Registration (RFC 7591), nur öffentliche Clients.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [redirect_uris], properties: { client_name: { type: string, maxLength: 100 }, redirect_uris: { type: array, minItems: 1, maxItems: 5, items: { type: string, format: uri } }, grant_types: { type: array, items: { type: string } }, token_endpoint_auth_method: { type: string, enum: [none] } } } } } }
      responses: { '201': { description: registriert, content: { application/json: { schema: { type: object, required: [client_id, redirect_uris], properties: { client_id: { type: string }, client_name: { type: string }, redirect_uris: { type: array, items: { type: string } }, token_endpoint_auth_method: { type: string } } } } } }, '400': { description: invalid_client_metadata } }
  /oauth/authorize:
    get:
      operationId: oauthAuthorize
      description: Autorisierungsendpunkt; leitet zur PWA-Seite /oauth/consent?request=<id> weiter (Login falls nötig). Fehler vor gültiger redirect_uri als HTML/JSON-Fehler, danach als Redirect mit error.
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
        - { name: scope, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: resource, in: query, required: true, schema: { type: string } }
      responses: { '302': { description: Weiterleitung } }
  /oauth/token:
    post:
      operationId: oauthToken
      requestBody: { required: true, content: { application/x-www-form-urlencoded: { schema: { type: object, required: [grant_type], properties: { grant_type: { type: string, enum: [authorization_code, refresh_token] }, code: { type: string }, redirect_uri: { type: string }, client_id: { type: string }, code_verifier: { type: string }, refresh_token: { type: string }, resource: { type: string } } } } } }
      responses: { '200': { description: Token, content: { application/json: { schema: { type: object, required: [access_token, token_type, expires_in], properties: { access_token: { type: string }, token_type: { type: string, const: Bearer }, expires_in: { type: integer }, refresh_token: { type: string }, scope: { type: string } } } } } }, '400': { description: invalid_grant / invalid_request / invalid_client } }
  /oauth/revoke:
    post:
      operationId: oauthRevoke
      requestBody: { required: true, content: { application/x-www-form-urlencoded: { schema: { type: object, required: [token], properties: { token: { type: string }, client_id: { type: string } } } } } }
      responses: { '200': { description: immer 200 (RFC 7009) } }
  /api/v1/oauth/requests/{id}:
    get:
      operationId: getOAuthRequest
      description: Consent-Daten für die angemeldete Person (Client-Name, Redirect-Host, angefragte Scopes). Nur der angemeldete Konto-Browser sieht sie (an Sitzung gebunden), 10 min gültig.
      security: [ { session: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/OAuthRequest' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/oauth/requests/{id}/decision:
    post:
      operationId: decideOAuthRequest
      description: Genehmigt (mit gewählter Scope-Teilmenge) oder lehnt ab; einmalig. Antwort liefert die Redirect-URL (mit code/state bzw. error).
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [approve], properties: { approve: { type: boolean }, scopes: { type: array, items: { $ref: '#/components/schemas/McpScope' } } } } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: object, required: [redirectUrl], properties: { redirectUrl: { type: string, format: uri } } } } } }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/me/oauth-grants:
    get:
      operationId: listOAuthGrants
      security: [ { session: [] } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OAuthGrant' } } } } } }
  /api/v1/me/oauth-grants/{id}:
    delete:
      operationId: revokeOAuthGrant
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: widerrufen }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/me/api-tokens:
    get:
      operationId: listApiTokens
      security: [ { session: [] } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ApiToken' } } } } } }
    post:
      operationId: createApiToken
      description: Persönliches MCP-Token; frische Sitzung nötig (403 reauth_required). Klartext nur in dieser Antwort.
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, scopes, expiresInDays], properties: { name: { type: string, maxLength: 80 }, scopes: { type: array, minItems: 1, items: { $ref: '#/components/schemas/McpScope' } }, expiresInDays: { type: integer, minimum: 1, maximum: 365 } } } } } }
      responses: { '201': { description: erzeugt, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/ApiToken' }, { type: object, required: [token], properties: { token: { type: string } } } ] } } } } }
  /api/v1/me/api-tokens/{id}:
    delete:
      operationId: revokeApiToken
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: widerrufen }, '404': { $ref: '#/components/responses/NotFound' } }
  /mcp:
    post:
      operationId: mcp
      description: MCP Streamable HTTP (JSON-RPC 2.0), siehe ADR-0009 (initialize, ping, tools/list, tools/call). Auth per Authorization-Header mit Bearer-Token (tto_… oder ttp_…).
      security: [ { bearer: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '200': { description: JSON-RPC Antwort }, '202': { description: Notification angenommen }, '401': { description: Token fehlt/ungültig (WWW-Authenticate mit resource_metadata) }, '403': { description: insufficient_scope } }
    get:
      operationId: mcpGet
      responses: { '405': { description: kein SSE-Stream in v1 } }
  /api/v1/notifications:
    get:
      operationId: listNotifications
      security: [ { session: [] } ]
      parameters:
        - { name: unreadOnly, in: query, schema: { type: boolean, default: false } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: before, in: query, schema: { type: string, format: date-time } }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: object, required: [items, unreadCount], properties: { items: { type: array, items: { $ref: '#/components/schemas/Notification' } }, unreadCount: { type: integer } } } } } } }
  /api/v1/notifications/read:
    post:
      operationId: markNotificationsRead
      description: Markiert die angegebenen (oder bei all=true alle) Hinweise als gelesen.
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { ids: { type: array, items: { type: string, format: uuid }, maxItems: 200 }, all: { type: boolean } } } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: object, required: [unreadCount], properties: { unreadCount: { type: integer } } } } } } }
  /api/v1/notifications/{id}:
    delete:
      operationId: deleteNotification
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: gelöscht }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/notifications/settings:
    get:
      operationId: getNotificationSettings
      security: [ { session: [] } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSettings' } } } } }
    put:
      operationId: putNotificationSettings
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSettings' } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSettings' } } } }, '400': { $ref: '#/components/responses/BadRequest' } }
  /api/v1/push/config:
    get:
      operationId: pushConfig
      description: Ob Web Push auf diesem Server verfügbar ist (VAPID konfiguriert) und der öffentliche Schlüssel.
      security: [ { session: [] } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: object, required: [available], properties: { available: { type: boolean }, vapidPublicKey: { type: string, description: base64url uncompressed P-256 } } } } } } }
  /api/v1/me/push-subscriptions:
    get:
      operationId: listPushSubscriptions
      security: [ { session: [] } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PushSubscriptionInfo' } } } } } }
    post:
      operationId: createPushSubscription
      description: Registriert das Gerät (idempotent über endpoint). 501 wenn Push nicht verfügbar, 409 bei mehr als 10 Abos.
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [endpoint, keys], properties: { endpoint: { type: string, format: uri }, keys: { type: object, required: [p256dh, auth], properties: { p256dh: { type: string }, auth: { type: string } } }, userAgent: { type: string, maxLength: 200 } } } } } }
      responses: { '201': { description: registriert, content: { application/json: { schema: { $ref: '#/components/schemas/PushSubscriptionInfo' } } } }, '501': { $ref: '#/components/responses/NotImplemented' } }
  /api/v1/me/push-subscriptions/replace:
    post:
      operationId: replacePushSubscription
      description: |
        Für das `pushsubscriptionchange`-Ereignis des Service Workers (B2, ADR-0017). Tauscht das Abo mit `previousEndpoint`
        (= `oldSubscription.endpoint`, nur im eigenen Konto gesucht) atomar gegen das neue aus: gleiche Id, neue Endpunkt-Adresse und Schlüssel,
        wartende Pushes bleiben erhalten (200). Ist der neue Endpunkt bereits registriert, bleibt diese Zeile bestehen und die alte wird entfernt (200).
        Fehlt `previousEndpoint` oder ist er unbekannt, wird wie bei POST /me/push-subscriptions neu registriert (201, Limit 10 Abos, sonst 409
        too_many_subscriptions). Endpunkt-Regeln und Schlüsselprüfung wie bei der Registrierung (400 bad_request); 501 push_unavailable ohne VAPID.
        Schreibende Anfrage: Sitzung und `X-CSRF-Token` (der Service Worker liest ihn über GET /api/v1/auth/session).
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [endpoint, keys], properties: { previousEndpoint: { type: string, maxLength: 2048, description: alter Endpunkt (oldSubscription.endpoint), optional }, endpoint: { type: string, format: uri }, keys: { type: object, required: [p256dh, auth], properties: { p256dh: { type: string }, auth: { type: string } } }, userAgent: { type: string, maxLength: 200 } } } } } }
      responses: { '200': { description: ersetzt, content: { application/json: { schema: { $ref: '#/components/schemas/PushSubscriptionInfo' } } } }, '201': { description: neu registriert, content: { application/json: { schema: { $ref: '#/components/schemas/PushSubscriptionInfo' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' }, '501': { $ref: '#/components/responses/NotImplemented' } }
  /api/v1/me/push-subscriptions/{id}:
    delete:
      operationId: deletePushSubscription
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: entfernt }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/me/push-subscriptions/{id}/test:
    post:
      operationId: sendTestPush
      description: Sendet eine generische Testnachricht an dieses Abo (Rate-Limit 5 je Stunde).
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '202': { description: gesendet }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/TooMany' }, '501': { $ref: '#/components/responses/NotImplemented' } }
  /api/v1/modules:
    get:
      operationId: listModules
      description: Status der abschaltbaren Module (ADR-0012) für das angemeldete Konto.
      security: [ { session: [] } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ModuleStatus' } } } } } }
  /api/v1/me/modules:
    put:
      operationId: putMyModules
      description: Eigene Auswahl. Nicht genannte Module bleiben unverändert; ein vom Server abgeschaltetes Modul kann nicht eingeschaltet werden (409 module_locked).
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [modules], properties: { modules: { type: object, additionalProperties: { type: boolean } } } } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ModuleStatus' } } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/admin/modules:
    get:
      operationId: getServerModules
      security: [ { session: [] } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ServerModule' } } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
    put:
      operationId: putServerModules
      description: Nur Admin. Setzt die serverweite Verfügbarkeit; vom Betreiber per Umgebung gesperrte Module sind nicht änderbar (409 module_locked).
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [modules], properties: { modules: { type: object, additionalProperties: { type: boolean } } } } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ServerModule' } } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/import-profiles/worktime/default-rules:
    get:
      operationId: worktimeDefaultRules
      description: Standard-Bemerkungsregeln des Import-Profils worktime_workbook (ADR-0013).
      security: [ { session: [] } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/WorktimeRemarkRule' } } } } } }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: tt_session }
    deviceToken: { type: http, scheme: bearer }
    bearer: { type: http, scheme: bearer, description: OAuth-Access-Token (tto_) oder persönliches Token (ttp_) nur für /mcp }
    csrf: { type: apiKey, in: header, name: X-CSRF-Token }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    BadRequest: { description: ungültige Anfrage, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: nicht angemeldet oder Nachweis ungültig, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: keine Berechtigung, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: nicht gefunden (auch bei fremden Objekten), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Konflikt, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    TooMany: { description: zu viele Versuche, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotImplemented: { description: auf diesem Server nicht konfiguriert, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Status:
      type: object
      required: [status]
      properties: { status: { type: string, const: ok } }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: { code: { type: string }, message: { type: string } }
    CreationOptions:
      type: object
      required: [challengeId, publicKey]
      properties:
        challengeId: { type: string }
        publicKey: { type: object, description: PublicKeyCredentialCreationOptionsJSON (W3C) }
    RequestOptions:
      type: object
      required: [challengeId, publicKey]
      properties:
        challengeId: { type: string }
        publicKey: { type: object, description: PublicKeyCredentialRequestOptionsJSON (W3C) }
    RegistrationCredential:
      type: object
      description: RegistrationResponseJSON (W3C), base64url
    AuthenticationCredential:
      type: object
      description: AuthenticationResponseJSON (W3C), base64url
    Passkey:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
    Account:
      type: object
      required: [id, handle, displayName, role]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [admin, member] }
    Session:
      type: object
      required: [account, csrfToken, recovery]
      properties:
        account: { $ref: '#/components/schemas/Account' }
        csrfToken: { type: string }
        recovery: { type: boolean, description: true = eingeschränkte Recovery-Sitzung }
        expiresAt: { type: string, format: date-time }
    RecoveryStatus:
      type: object
      required: [recoveryCodes, fallbackPassword, email]
      properties:
        recoveryCodes: { type: object, required: [active], properties: { active: { type: boolean }, remaining: { type: integer } } }
        fallbackPassword: { type: object, required: [active], properties: { active: { type: boolean } } }
        email: { type: object, required: [available, active], properties: { available: { type: boolean, description: false wenn Server ohne Mailversand }, active: { type: boolean }, verified: { type: boolean } } }
    Invitation:
      type: object
      required: [id, createdAt, expiresAt, status]
      properties:
        id: { type: string, format: uuid }
        note: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        status: { type: string, enum: [open, used, expired, revoked] }
    InvitationCreated:
      allOf:
        - $ref: '#/components/schemas/Invitation'
        - type: object
          required: [token]
          properties: { token: { type: string } }
    SegmentKind: { type: string, enum: [work, travel, school] }
    DayMarkKind: { type: string, enum: [none, holiday, vacation, sick, excused, school_credit] }
    WorkModelInput:
      type: object
      required: [validFrom, weeklyTargetSeconds, workdays]
      properties:
        validFrom: { type: string, format: date }
        validTo: { type: [string, 'null'], format: date }
        timezone: { type: string, default: Europe/Berlin }
        weeklyTargetSeconds: { type: integer, minimum: 0 }
        workdays: { type: array, items: { type: integer, minimum: 1, maximum: 7, description: 1=Montag..7=Sonntag } }
        dailyTargetSeconds: { type: object, additionalProperties: { type: integer, minimum: 0 }, description: optional je Wochentag "1".."7", hat Vorrang }
        travelCountsAsWork: { type: boolean, default: true }
        roundingEnabled: { type: boolean, default: true }
        roundingMinutes: { type: integer, minimum: 1, maximum: 60, default: 15 }
        schoolFullDayThresholdSeconds: { type: integer, minimum: 0, default: 10800 }
        schoolCreditSeconds: { type: [integer, 'null'], description: null = Tages-Soll }
        dayBoundaryMinutes: { type: integer, minimum: 0, maximum: 719, default: 0 }
        fixedBreaks: { type: array, items: { type: object, required: [start, end], properties: { start: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }, end: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' } } } }
    WorkModel:
      allOf:
        - $ref: '#/components/schemas/WorkModelInput'
        - type: object
          required: [id, createdAt]
          properties: { id: { type: string, format: uuid }, createdAt: { type: string, format: date-time } }
    PlaceInput:
      type: object
      required: [name, kind, automationMode]
      properties:
        name: { type: string, maxLength: 80 }
        kind: { type: string, enum: [office, home, customer, school, other] }
        automationMode: { type: string, enum: [direct, suggest, off] }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
        radiusMeters: { type: [integer, 'null'], minimum: 20 }
        confirmAfterSeconds: { type: integer, minimum: 0, default: 300 }
        defaultSegmentKind: { $ref: '#/components/schemas/SegmentKind' }
    Place:
      allOf:
        - $ref: '#/components/schemas/PlaceInput'
        - type: object
          required: [id, archived]
          properties: { id: { type: string, format: uuid }, archived: { type: boolean } }
    SegmentInput:
      type: object
      required: [kind, startedAt]
      properties:
        kind: { $ref: '#/components/schemas/SegmentKind' }
        placeId: { type: [string, 'null'], format: uuid }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        note: { type: [string, 'null'], maxLength: 500 }
    SegmentCorrection:
      type: object
      required: [reason]
      properties:
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        kind: { $ref: '#/components/schemas/SegmentKind' }
        placeId: { type: [string, 'null'], format: uuid }
        note: { type: [string, 'null'], maxLength: 500 }
        reason: { type: string, minLength: 1, maxLength: 200 }
    Segment:
      type: object
      required: [id, kind, startedAt, endedAt, rawStartedAt, rawEndedAt, source, version, voided, needsReview]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/SegmentKind' }
        placeId: { type: [string, 'null'], format: uuid }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        rawStartedAt: { type: string, format: date-time }
        rawEndedAt: { type: [string, 'null'], format: date-time }
        source: { type: string, enum: [timer, manual, automation, suggestion, import] }
        note: { type: [string, 'null'] }
        version: { type: integer }
        voided: { type: boolean }
        needsReview: { type: boolean }
        revisions: { type: integer, description: Anzahl Korrekturen }
    DayEvaluation:
      type: object
      required: [date, targetSeconds, rawWorkSeconds, breakDeductionSeconds, startAdjustSeconds, endAdjustSeconds, evaluatedWorkSeconds, creditSeconds, deltaSeconds, provisional, segmentIds, breakHints]
      properties:
        date: { type: string, format: date }
        modelId: { type: [string, 'null'], format: uuid }
        mark: { $ref: '#/components/schemas/DayMarkKind' }
        skipFixedBreaks: { type: boolean }
        targetSeconds: { type: integer }
        rawWorkSeconds: { type: integer }
        breakDeductionSeconds: { type: integer }
        startAdjustSeconds: { type: integer }
        endAdjustSeconds: { type: integer }
        evaluatedWorkSeconds: { type: integer }
        creditSeconds: { type: integer, description: Schulregel/Markierungsgutschrift anstelle der Segmentsumme }
        deltaSeconds: { type: integer, description: evaluated(+credit) - target }
        evaluatedStart: { type: [string, 'null'], format: date-time }
        evaluatedEnd: { type: [string, 'null'], format: date-time }
        provisional: { type: boolean }
        segmentIds: { type: array, items: { type: string, format: uuid } }
        segments: { type: array, items: { $ref: '#/components/schemas/Segment' }, description: Segmente dieses Arbeitstags (Zuordnung nach ADR-0004; ohne stornierte) }
        markCreditSeconds: { type: [integer, 'null'], description: gesetzte Gutschrift der Markierung }
        markSource: { type: string, enum: [none, explicit, absence, holiday], description: Herkunft der wirksamen Markierung (explicit = manuell gesetzt) }
        targetOverrideSeconds: { type: [integer, 'null'], description: abweichendes Soll, z. B. halber Urlaubstag }
        note: { type: [string, 'null'] }
        breakHints: { type: array, items: { type: object, required: [code], properties: { code: { type: string, enum: [break_missing_30, break_missing_45, break_part_too_short, work_over_6h_without_break] } } } }
    TimeAccount:
      type: object
      required: [asOf, balanceSeconds, openingSeconds, adjustmentSeconds, provisional]
      properties:
        asOf: { type: string, format: date }
        accountStart: { type: [string, 'null'], format: date }
        balanceSeconds: { type: integer }
        openingSeconds: { type: integer }
        adjustmentSeconds: { type: integer }
        provisional: { type: boolean }
    Suggestion:
      type: object
      required: [id, type, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [start, end] }
        placeId: { type: [string, 'null'], format: uuid }
        proposedStartedAt: { type: [string, 'null'], format: date-time }
        proposedEndedAt: { type: [string, 'null'], format: date-time }
        segmentId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
    DeviceToken:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scope: { type: string, const: automation }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
    AutomationEvent:
      type: object
      required: [eventId, deviceId, type, occurredAt, placeId]
      properties:
        eventId: { type: string, format: uuid }
        deviceId: { type: string, maxLength: 80 }
        type: { type: string, enum: [arrival, presence_confirmed, departure, cancel] }
        placeId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
    VacationSettings:
      type: object
      required: [region, annualEntitlementHalfDays]
      properties:
        configured: { type: boolean, readOnly: true, description: false solange keine Einstellungen gespeichert sind; GET liefert dann die Standardwerte (200) }
        region: { type: string, default: DE-ST }
        annualEntitlementHalfDays: { type: integer, minimum: 0, default: 60, description: 30 Tage = 60 halbe Tage (ADR-0005) }
        carryOverByYear: { type: object, additionalProperties: { type: integer, minimum: 0 }, description: 'Übertrag je Urlaubsjahr in halben Tagen, z. B. {"2026": 8}; fehlend = 0, gilt nicht bei Stichtagsbestand im selben Jahr' }
        carryOverExpiry: { type: [string, 'null'], description: Verfall als MM-DD (z. B. 03-31) oder null }
    VacationBalance:
      type: object
      required: [year, entitlementHalfDays, carryOverHalfDays, adjustmentHalfDays, bookedHalfDays, plannedHalfDays, availableHalfDays, availableAfterPlannedHalfDays]
      properties:
        year: { type: integer }
        snapshotDate: { type: [string, 'null'], format: date }
        snapshotRemainingHalfDays: { type: [integer, 'null'], description: Stichtagsbestand; bei Snapshot sind Anspruch und Übertrag des Jahres 0 }
        entitlementHalfDays: { type: integer }
        carryOverHalfDays: { type: integer }
        adjustmentHalfDays: { type: integer }
        bookedHalfDays: { type: integer, description: Status approved oder taken }
        plannedHalfDays: { type: integer, description: Status planned oder requested }
        availableHalfDays: { type: integer }
        availableAfterPlannedHalfDays: { type: integer }
    AbsenceInput:
      type: object
      required: [kind, startDate, endDate, status]
      properties:
        kind: { type: string, enum: [vacation, sick, excused, other], description: excused = bezahlt frei ohne Urlaubsverbrauch (ADR-0013) }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        halfDayStart: { type: boolean, default: false, description: erster Tag nur halber Tag }
        halfDayEnd: { type: boolean, default: false, description: letzter Tag nur halber Tag }
        status: { type: string, enum: [planned, requested, approved, rejected, cancelled, taken] }
        note: { type: [string, 'null'], maxLength: 500 }
        documentStatus: { type: string, enum: [not_needed, pending, submitted], default: not_needed }
        documentSubmittedOn: { type: [string, 'null'], format: date }
        documentReferenceStart: { type: [string, 'null'], format: date }
        documentReferenceEnd: { type: [string, 'null'], format: date }
    Absence:
      allOf:
        - $ref: '#/components/schemas/AbsenceInput'
        - type: object
          required: [id, version, countedHalfDays]
          properties: { id: { type: string, format: uuid }, version: { type: integer }, countedHalfDays: { type: integer, description: berechneter Verbrauch (nur Arbeitstage, ohne Feiertage) } }
    CalendarDay:
      type: object
      required: [startDate, endDate, name, kind, source]
      properties:
        id: { type: [string, 'null'], format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        name: { type: string }
        kind: { type: string, enum: [holiday, school_holiday] }
        source: { type: string, enum: [builtin, custom] }
    PlanDayInput:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [office, home, customer, school, off] }
        placeId: { type: [string, 'null'], format: uuid }
        note: { type: [string, 'null'], maxLength: 200 }
    PlanDay:
      allOf:
        - $ref: '#/components/schemas/PlanDayInput'
        - type: object
          required: [date]
          properties: { date: { type: string, format: date } }
    ShareScopes:
      type: object
      properties:
        plan: { type: boolean, default: false }
        actual: { type: boolean, default: false }
        vacation: { type: boolean, default: false }
    Share:
      type: object
      required: [id, recipientHandle, scopes, createdAt]
      properties:
        id: { type: string, format: uuid }
        recipientHandle: { type: string }
        scopes: { $ref: '#/components/schemas/ShareScopes' }
        createdAt: { type: string, format: date-time }
    IncomingShare:
      type: object
      required: [id, ownerDisplayName, scopes]
      properties:
        id: { type: string, format: uuid }
        ownerDisplayName: { type: string }
        scopes: { $ref: '#/components/schemas/ShareScopes' }
    SharedView:
      type: object
      properties:
        plan: { type: array, items: { type: object, required: [date, mode], properties: { date: { type: string, format: date }, mode: { type: string, enum: [office, home, customer, school, off] } } } }
        actual: { type: array, items: { type: object, required: [date, evaluatedWorkSeconds], properties: { date: { type: string, format: date }, evaluatedStart: { type: [string, 'null'], format: date-time }, evaluatedEnd: { type: [string, 'null'], format: date-time }, evaluatedWorkSeconds: { type: integer } } } }
        vacation: { type: array, items: { type: object, required: [startDate, endDate], properties: { startDate: { type: string, format: date }, endDate: { type: string, format: date } } } }
    ImportJob:
      type: object
      required: [id, filename, kind, status, sheets, createdAt]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        kind: { type: string, enum: [csv, xlsx] }
        status: { type: string, enum: [uploaded, mapped, committed, rolled_back] }
        sheets: { type: array, items: { type: string } }
        detectedProfile: { type: string, enum: [generic, worktime_workbook], description: worktime_workbook bei erkannter Arbeitszeit-Tabelle }
        sha256: { type: string }
        createdAt: { type: string, format: date-time }
    ImportMapping:
      type: object
      required: [sheet, headerRow, columns, dateFormat, timeFormat]
      properties:
        profile: { type: string, enum: [generic, worktime_workbook], default: generic, description: Bei worktime_workbook sind sheet/headerRow/columns/Formate ohne Bedeutung (Platzhalter erlaubt) und worktime wird ausgewertet }
        worktime: { $ref: '#/components/schemas/WorktimeOptions' }
        sheet: { type: string }
        headerRow: { type: integer, minimum: 0, description: 0 = keine Kopfzeile }
        timezone: { type: string, default: Europe/Berlin }
        dateFormat: { type: string, enum: [dd.MM.yyyy, yyyy-MM-dd, excel_serial] }
        timeFormat: { type: string, enum: [HH:mm, excel_fraction, decimal_hours] }
        defaultKind: { $ref: '#/components/schemas/SegmentKind' }
        columns:
          type: object
          required: [date]
          properties:
            date: { type: integer, minimum: 0 }
            start: { type: [integer, 'null'], minimum: 0 }
            end: { type: [integer, 'null'], minimum: 0 }
            duration: { type: [integer, 'null'], minimum: 0, description: Dauer statt Ende (Format laut timeFormat) }
            kind: { type: [integer, 'null'], minimum: 0 }
            place: { type: [integer, 'null'], minimum: 0 }
            note: { type: [integer, 'null'], minimum: 0 }
        skipSummaryRows: { type: boolean, default: true }
        allowOvernight: { type: boolean, default: false, description: Ende vor Beginn gilt als Folgetag; sonst Fehler end_before_start (24:00 immer erlaubt) }
    ImportPreview:
      type: object
      required: [rows, valid, errors, duplicates, sample]
      properties:
        rows: { type: integer }
        errorCount: { type: integer, description: Gesamtzahl der Fehler; errors ist auf 1000 begrenzt }
        skippedSummaryRows: { type: integer }
        profile: { type: string, enum: [generic, worktime_workbook] }
        warnings: { type: array, items: { type: object, required: [code], properties: { code: { type: string, enum: [pause_exceeds_day, holiday_times_discarded, credit_partial_as_work, school_on_holiday] }, row: { type: [integer, 'null'] }, count: { type: integer, description: bei zusammengefassten Warnungen die Anzahl betroffener Tage } } }, description: Hinweise ohne Commit-Hindernis }
        worktime: { $ref: '#/components/schemas/WorktimePreview' }
        valid: { type: integer }
        duplicates: { type: integer }
        errors: { type: array, items: { type: object, required: [row, code], properties: { row: { type: integer }, code: { type: string, enum: [date_invalid, time_invalid, end_before_start, missing_value, overlap, formula_without_value, summary_row, unknown_place, unknown_kind, note_too_long, duplicate_date_conflict, planning_disabled] } } } }
        sample: { type: array, items: { type: object, properties: { date: { type: string, format: date }, startedAt: { type: string, format: date-time }, endedAt: { type: string, format: date-time }, kind: { $ref: '#/components/schemas/SegmentKind' } } } }
    ImportResult:
      type: object
      required: [batchId, created, skipped]
      properties:
        rolledBack: { type: integer, description: bei Rollback die Zahl stornierter Segmente }
        absencesCreated: { type: integer }
        customDaysCreated: { type: integer }
        warnings: { type: array, items: { type: object, required: [code], properties: { code: { type: string, enum: [pause_exceeds_day, holiday_times_discarded, credit_partial_as_work, school_on_holiday] }, row: { type: [integer, 'null'] }, count: { type: integer } } }, description: wie ImportPreview.warnings, auch im Ergebnis des Commits }
        batchId: { type: string, format: uuid }
        created: { type: integer }
        skipped: { type: integer }
        conflicts: { type: array, items: { type: string, format: uuid } }
        conflictItems: { type: array, items: { type: object, required: [type, id], properties: { type: { type: string, enum: [segment, absence, custom_day] }, id: { type: string, format: uuid } } }, description: typisierte Konfliktliste (zusätzlich zu conflicts), auch im Fehlerobjekt rollback_conflict }
    ImportTemplate:
      type: object
      required: [id, name, mapping]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        mapping: { $ref: '#/components/schemas/ImportMapping' }
    StorageRule:
      type: object
      required: [backend]
      properties:
        maxBytes: { type: [integer, 'null'], minimum: 1, description: obere Grenze (inklusive); null = alles darüber/Rest }
        backend: { type: string, enum: [db, s3, local] }
    StorageSettingsInput:
      type: object
      required: [rules]
      properties:
        rules: { type: array, minItems: 1, items: { $ref: '#/components/schemas/StorageRule' }, description: geordnet; erste passende Regel gewinnt; letzte muss maxBytes null haben }
        maxUploadBytes: { type: integer, minimum: 1, default: 10485760 }
        localPath: { type: [string, 'null'] }
        s3:
          type: [object, 'null']
          properties:
            endpoint: { type: string }
            region: { type: string }
            bucket: { type: string }
            pathStyle: { type: boolean, default: true }
            accessKeyId: { type: string }
            secretAccessKey: { type: string, writeOnly: true }
    StorageSettings:
      type: object
      required: [rules, maxUploadBytes, hasSecret]
      properties:
        rules: { type: array, items: { $ref: '#/components/schemas/StorageRule' } }
        maxUploadBytes: { type: integer }
        localPath: { type: [string, 'null'] }
        s3: { type: [object, 'null'], properties: { endpoint: { type: string }, region: { type: string }, bucket: { type: string }, pathStyle: { type: boolean }, accessKeyId: { type: string } } }
        hasSecret: { type: boolean }
    FileMeta:
      type: object
      required: [id, name, size, sha256, contentType, backend, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        size: { type: integer }
        sha256: { type: string }
        contentType: { type: string }
        backend: { type: string, enum: [db, s3, local] }
        createdAt: { type: string, format: date-time }
    ExternalIdentity:
      type: object
      required: [id, providerName, linkedAt]
      properties:
        id: { type: string, format: uuid }
        providerName: { type: string }
        emailHint: { type: [string, 'null'], description: Anzeige der E-Mail des Anbieters, nur Hinweis, nie Verknüpfungsgrundlage }
        linkedAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
    LearningFieldInput:
      type: object
      required: [name]
      properties:
        number: { type: [integer, 'null'], minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 120 }
        sortOrder: { type: integer, default: 0 }
    LearningField:
      allOf:
        - $ref: '#/components/schemas/LearningFieldInput'
        - type: object
          required: [id]
          properties: { id: { type: string, format: uuid } }
    ReportEntryInput:
      type: object
      required: [date, learningField]
      properties:
        date: { type: string, format: date }
        learningFieldId: { type: [string, 'null'], format: uuid }
        learningField: { type: string, minLength: 1, maxLength: 120, description: Name (Snapshot); bei learningFieldId wird der aktuelle Name übernommen }
        durationSeconds: { type: integer, minimum: 0, maximum: 86400, default: 0 }
        notes: { type: string, maxLength: 4000, default: '' }
    ReportEntry:
      allOf:
        - $ref: '#/components/schemas/ReportEntryInput'
        - type: object
          required: [id, version, createdAt]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
            createdAt: { type: string, format: date-time }
            draft: { type: boolean, description: true bei später KI-erzeugten, noch nicht bestätigten Entwürfen }
    ReportWeek:
      type: object
      required: [year, week, startDate, endDate, status, entries, totalSeconds, byLearningField, sourceCount]
      properties:
        year: { type: integer }
        week: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [draft, done] }
        entries: { type: array, items: { $ref: '#/components/schemas/ReportEntry' } }
        totalSeconds: { type: integer }
        byLearningField: { type: array, items: { type: object, required: [learningField, seconds], properties: { learningField: { type: string }, seconds: { type: integer } } } }
        trackedWorkSeconds: { type: integer, description: bewertete Arbeitszeit der Woche aus dem Zeittracking (nur Hinweis) }
        sourceCount: { type: integer }
    ReportSourceInput:
      type: object
      required: [year, week]
      properties:
        year: { type: integer }
        week: { type: integer }
        date: { type: [string, 'null'], format: date }
        note: { type: [string, 'null'], maxLength: 4000 }
        fileId: { type: [string, 'null'], format: uuid }
    ReportSource:
      allOf:
        - $ref: '#/components/schemas/ReportSourceInput'
        - type: object
          required: [id, createdAt]
          properties: { id: { type: string, format: uuid }, createdAt: { type: string, format: date-time }, file: { oneOf: [ { $ref: '#/components/schemas/FileMeta' }, { type: 'null' } ] } }
    McpScope:
      type: string
      enum: [time:read, time:write, schedule:read, schedule:write, reports:read, reports:write, documents:read]
    OAuthRequest:
      type: object
      required: [id, clientName, redirectHost, scopes, expiresAt]
      properties:
        id: { type: string, format: uuid }
        clientName: { type: string }
        redirectHost: { type: string }
        scopes: { type: array, items: { $ref: '#/components/schemas/McpScope' } }
        expiresAt: { type: string, format: date-time }
    OAuthGrant:
      type: object
      required: [id, clientName, scopes, createdAt]
      properties:
        id: { type: string, format: uuid }
        clientName: { type: string }
        scopes: { type: array, items: { $ref: '#/components/schemas/McpScope' } }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
    ApiToken:
      type: object
      required: [id, name, scopes, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scopes: { type: array, items: { $ref: '#/components/schemas/McpScope' } }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
    NotificationKind:
      type: string
      enum: [running_timer, pending_suggestions, report_gap, document_submission, system]
    Notification:
      type: object
      required: [id, kind, title, body, createdAt, read]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/NotificationKind' }
        title: { type: string }
        body: { type: string }
        url: { type: [string, 'null'], description: relativer PWA-Pfad }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
    NotificationSettings:
      type: object
      required: [categories]
      properties:
        categories:
          type: object
          description: Schlüssel = NotificationKind (ohne system)
          additionalProperties:
            type: object
            required: [inApp, push]
            properties:
              inApp: { type: boolean }
              push: { type: boolean }
              thresholdMinutes: { type: integer, minimum: 30, maximum: 1440, description: nur running_timer }
              weekday: { type: integer, minimum: 1, maximum: 7, description: nur report_gap }
              time: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', description: nur report_gap, lokal }
        quietStart: { type: [string, 'null'], pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        quietEnd: { type: [string, 'null'], pattern: '^[0-2][0-9]:[0-5][0-9]$' }
    PushSubscriptionInfo:
      type: object
      required: [id, createdAt]
      properties:
        id: { type: string, format: uuid }
        host: { type: string, description: Push-Dienst-Host (nicht der volle Endpunkt) }
        userAgent: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        lastSuccessAt: { type: [string, 'null'], format: date-time }
    ModuleKey:
      type: string
      enum: [reports, planning, transfer, automation, mcp]
    ModuleStatus:
      type: object
      required: [key, serverEnabled, accountEnabled, effective, lockedByOperator]
      properties:
        key: { $ref: '#/components/schemas/ModuleKey' }
        serverEnabled: { type: boolean }
        accountEnabled: { type: boolean }
        effective: { type: boolean }
        lockedByOperator: { type: boolean }
    ServerModule:
      type: object
      required: [key, enabled, lockedByOperator]
      properties:
        key: { $ref: '#/components/schemas/ModuleKey' }
        enabled: { type: boolean }
        lockedByOperator: { type: boolean }
    WorktimeAction:
      type: string
      enum: [work, school, vacation, sick, excused, holiday, skip]
    WorktimeRemarkRule:
      type: object
      required: [pattern, action]
      properties:
        pattern: { type: string, maxLength: 80, description: Teilstring (ohne Groß/Kleinschreibung); mit ^ und $ als exakter Text }
        action: { $ref: '#/components/schemas/WorktimeAction' }
    WorktimeOptions:
      type: object
      properties:
        pauseMode: { type: string, enum: [split, none], default: split }
        pauseMinutes: { type: [integer, 'null'], minimum: 0, maximum: 240, description: null = Wert aus der Tabelle (H1) }
        pauseStart: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', default: '12:00' }
        roundToMinutes: { type: boolean, default: true }
        holidayTimes: { type: string, enum: [discard, keep], default: discard, description: Zeilen mit Zeiten auf gesetzlichen oder eigenen Feiertagen. discard = keine Abschnitte, Tag gilt als Feiertag (Warnung holiday_times_discarded); keep = als Arbeit/Schule übernehmen (Mehrarbeit) }
        partialCredit: { type: string, enum: [work, absence], default: work, description: Zeilen der Aktion vacation/sick/excused, deren Nettozeit mehr als 5 Minuten vom Tages-Soll abweicht. work = als Arbeit mit Notiz übernehmen (Warnung credit_partial_as_work); absence = trotzdem als Abwesenheit }
        rules: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/WorktimeRemarkRule' }, description: fehlend/null = Standardregeln; eine leere Liste ersetzt sie durch keine Regeln (alles wird Arbeit) }
    WorktimePreview:
      type: object
      properties:
        days: { type: integer }
        segments: { type: integer }
        absences: { type: integer }
        customDays: { type: integer }
        skippedHolidays: { type: integer }
        firstDate: { type: [string, 'null'], format: date }
        lastDate: { type: [string, 'null'], format: date }
        dateSystem: { type: string, enum: ['1900', '1904'] }
        sheetBalanceSeconds: { type: [integer, 'null'], description: Summe der zwischengespeicherten Differenzen der Tabelle über alle Zeilen (nur Hinweis) }
        sheetBalanceUpToTodaySeconds: { type: [integer, 'null'], description: wie sheetBalanceSeconds, aber nur Zeilen bis einschließlich heute (vergleichbar mit dem Zeitkonto der App) }
        sheetBalanceFutureSeconds: { type: [integer, 'null'], description: Anteil der Zeilen nach heute }
        firstContentDate: { type: [string, 'null'], format: date, description: erster Tag mit Zeiten oder Bemerkung; Vorschlag für den Beginn des Arbeitsmodells, damit leere Tage davor nicht als Fehlzeit zählen }
        unmappedRemarks: { type: array, items: { type: object, required: [text, count], properties: { text: { type: string }, count: { type: integer } } } }
        byAction: { type: object, additionalProperties: { type: integer } }
