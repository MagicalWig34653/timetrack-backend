        colorScheme: { $ref: '#/components/schemas/ColorSchemeId' }
        glow: { $ref: '#/components/schemas/GlowId' }
        updatedAt: { type: [string, 'null'], format: date-time, description: 'Zeitpunkt der letzten Änderung; fehlt, solange die Standardwerte gelten' }
    Account:
      type: object
