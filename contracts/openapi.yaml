    MailTestResult:
      type: object
      required: [sent, to, durationMs]
      properties: { sent: { type: boolean }, to: { type: string }, durationMs: { type: integer } }
    StorageSettings:
      type: object
      required: [rules, maxUploadBytes, hasSecret]
      properties:
        rules: { type: array, items: { $ref: '#/components/schemas/StorageRule' } }
        maxUploadBytes: { type: integer }
        localPath: { type: [string, 'null'] }
        s3: { type: [object, 'null'], properties: { endpoint: { type: string }, region: { type: string }, bucket: { type: string }, pathStyle: { type: boolean }, accessKeyId: { type: string } } }
        hasSecret: { type: boolean }
    VacationRequestForm:
