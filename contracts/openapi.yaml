    AccentId: { type: string, enum: [blue, teal, violet, green, orange, pink, graphite, indigo, navy, purple, magenta, crimson, forest, petrol, bronze, wine, slate, cocoa, olive, ocean, ink, custom] }
    GlowId: { type: string, enum: [off, subtle, medium, strong] }
    ColorSchemeId: { type: string, enum: [system, light, dark] }
    Preferences:
      type: object
      required: [accent, colorScheme]
