openapi: 3.1.0
info:
  title: Timetrack API
  version: 0.3.0
  description: |
    Vertrag Etappe 1 (Konten, Passkeys, Einladungen, Recovery). Maßgeblich für Backend (C1/C2) und
    PWA (L1). Änderungen nur koordiniert durch den Lead (siehe docs/ARBEITSPLAN.md).
    Annahmen (ADR-0003): Basispfad /api/v1; Sitzung per HttpOnly-Cookie `tt_session`;
    schreibende Requests mit Sitzung senden Header `X-CSRF-Token` (Wert aus GET /api/v1/auth/session).
    WebAuthn-Optionen/-Antworten folgen den JSON-Formen der W3C-Spezifikation (base64url-Felder).
    Fehler immer als application/json `{ "error": { "code": string, "message": string } }`.
    Antworten verraten nie, ob eine Kontoadresse existiert.
    Error codes (English, stable): bad_request, unauthorized, forbidden, not_found, conflict, handle_taken,
    last_passkey, too_many_requests, not_implemented, invalid_code, csrf_invalid,
    recovery_session_restricted, reauth_required, not_ready.
    Decisions (Lead, 14.10.2026): (1) register/options returns 409 handle_taken for duplicate handle and 400 bad_request
    for validation errors. (2) Adding/revoking passkeys and changing recovery settings require a "fresh" session
    (login within the last 10 minutes) or a recovery session; otherwise 403 reauth_required, and the client signs in again.
    (3) A successful POST /me/passkeys/verify inside a recovery session upgrades it to a normal session (recovery=false).
    (4) DELETE /auth/session is allowed in recovery sessions. (5) Invitation links have the form
    `<PUBLIC_BASE_URL>/invite/<token>`; `App bootstrap-admin` prints exactly this form.
    (6) No session listing endpoint in stage 1; only revoking other sessions.
    Stage 3 (v0.3.0): see docs/decisions/ADR-0005. Half days as integers (30 days = 60). Sick absences and documents are never part of shares.
    Stage 2 decisions (v0.2.1): a work model `validFrom` may lie in the past but must be later than the previous version's `validFrom` (else 409 model_overlap);
    days on or after it are then evaluated by the new version (explicit user act). Future days are never `provisional`; today and days with a running segment are.
    A second accept of a suggestion returns 409 `suggestion_resolved`. Further codes: timer_already_running, no_running_timer, segment_overlap, stale_version, model_overlap.
servers:
  - url: /
paths:
  /health:
    get:
      operationId: health
      description: Prozess-Liveness, ohne Datenbank.
      responses:
        '200':
          description: Prozess antwortet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
  /ready:
    get:
      operationId: ready
      description: Readiness inklusive Datenbankverbindung und angewendeter Migrationen.
      responses:
        '200': { description: bereit, content: { application/json: { schema: { $ref: '#/components/schemas/Status' } } } }
        '503': { description: nicht bereit, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/invitations/{token}:
    get:
      operationId: inspectInvitation
      description: Prüft, ob ein Einladungstoken gültig ist (ohne Details zum Einladenden).
      parameters: [ { name: token, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: gültig
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid: { type: boolean, const: true }
                  expiresAt: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/auth/register/options:
    post:
      operationId: registerOptions
      description: Startet Registrierung per Einladung; liefert WebAuthn-Creation-Options.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteToken, handle, displayName]
              properties:
                inviteToken: { type: string }
                handle: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{2,31}$', description: eindeutige Kontokennung (Kleinbuchstaben); dient als Recovery-Identifier }
                displayName: { type: string, minLength: 1, maxLength: 80 }
                email: { type: string, format: email, description: optional; unverifiziert bis Bestätigung }
      responses:
        '200':
          description: Challenge erzeugt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreationOptions' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooMany' }
  /api/v1/auth/register/verify:
    post:
      operationId: registerVerify
      description: |
        Prüft die Attestation und legt Konto, ersten Passkey und Sitzung atomar an; verbraucht die
        Einladung genau einmal (paralleles Einlösen: genau ein Erfolg).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, credential]
              properties:
                challengeId: { type: string }
                credential: { $ref: '#/components/schemas/RegistrationCredential' }
                passkeyName: { type: string, maxLength: 80 }
      responses:
        '201':
          description: Konto angelegt; Set-Cookie tt_session
          content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/auth/login/options:
    post:
      operationId: loginOptions
      description: Startet Anmeldung (discoverable credentials, keine Kontoangabe nötig).
      responses:
        '200':
          description: Challenge erzeugt
          content: { application/json: { schema: { $ref: '#/components/schemas/RequestOptions' } } }
        '429': { $ref: '#/components/responses/TooMany' }
  /api/v1/auth/login/verify:
    post:
      operationId: loginVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, credential]
              properties:
                challengeId: { type: string }
                credential: { $ref: '#/components/schemas/AuthenticationCredential' }
      responses:
        '200':
          description: angemeldet; Set-Cookie tt_session
          content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/session:
    get:
      operationId: currentSession
      description: Aktuelle Sitzung samt CSRF-Token und Konto.
      security: [ { session: [] } ]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: logout
      security: [ { session: [], csrf: [] } ]
      responses:
        '204': { description: Sitzung beendet }
  /api/v1/me/passkeys:
    get:
      operationId: listPasskeys
      security: [ { session: [] } ]
      responses:
        '200':
          description: Passkeys des eigenen Kontos
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Passkey' } }
  /api/v1/me/passkeys/options:
    post:
      operationId: addPasskeyOptions
      description: Weiteren Passkey hinzufügen; erfordert frische Authentisierung oder Recovery-Sitzung.
      security: [ { session: [], csrf: [] } ]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/CreationOptions' } } } }
  /api/v1/me/passkeys/verify:
    post:
      operationId: addPasskeyVerify
      security: [ { session: [], csrf: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, credential]
              properties:
                challengeId: { type: string }
                credential: { $ref: '#/components/schemas/RegistrationCredential' }
                passkeyName: { type: string, maxLength: 80 }
      responses:
        '201': { description: hinzugefügt, content: { application/json: { schema: { $ref: '#/components/schemas/Passkey' } } } }
  /api/v1/me/passkeys/{id}:
    patch:
      operationId: renamePasskey
      security: [ { session: [], csrf: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 80 } } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Passkey' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: revokePasskey
      description: Widerruft einen Passkey. Der letzte Passkey kann nur widerrufen werden, wenn eine Recovery-Methode aktiv ist.
      security: [ { session: [], csrf: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '204': { description: widerrufen }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/me/recovery:
    get:
      operationId: recoveryStatus
      security: [ { session: [] } ]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryStatus' } } } }
  /api/v1/me/recovery/recovery-codes:
    post:
      operationId: generateRecoveryCodes
      description: Erzeugt einen neuen Satz Recovery-Codes (invalidiert den alten). Klartext nur in dieser Antwort.
      security: [ { session: [], csrf: [] } ]
      responses:
        '201':
          description: Codes
          content:
            application/json:
              schema:
                type: object
                required: [codes]
                properties: { codes: { type: array, items: { type: string } } }
    delete:
      operationId: disableRecoveryCodes
      security: [ { session: [], csrf: [] } ]
      responses: { '204': { description: deaktiviert } }
  /api/v1/me/recovery/fallback-password:
    put:
      operationId: setFallbackPassword
      description: Setzt oder ersetzt das Rückfallpasswort (nur für Recovery, nie für normale Anmeldung).
      security: [ { session: [], csrf: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string, minLength: 12, maxLength: 256 } } } } }
      responses: { '204': { description: gesetzt }, '400': { $ref: '#/components/responses/BadRequest' } }
    delete:
      operationId: removeFallbackPassword
      security: [ { session: [], csrf: [] } ]
      responses: { '204': { description: entfernt } }
  /api/v1/me/recovery/email:
    put:
      operationId: enableEmailRecovery
      description: Startet Verifikation der Adresse; 409/501 wenn Server ohne Mailversand konfiguriert ist.
      security: [ { session: [], csrf: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } }
      responses: { '202': { description: Verifikationscode versendet }, '501': { $ref: '#/components/responses/NotImplemented' } }
    delete:
      operationId: disableEmailRecovery
      security: [ { session: [], csrf: [] } ]
      responses: { '204': { description: deaktiviert } }
  /api/v1/me/recovery/email/verify:
    post:
      operationId: verifyRecoveryEmail
      security: [ { session: [], csrf: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses: { '204': { description: verifiziert und aktiv }, '400': { $ref: '#/components/responses/BadRequest' } }
  /api/v1/auth/recovery/start:
    post:
      operationId: recoveryStart
      description: |
        Startet Wiederherstellung. Antwort ist für unbekannte Konten und gültige Konten gleich (202),
        um Kontoexistenz nicht zu verraten. Methode `email` sendet einen Code (falls aktiv), `recovery-code`
        und `fallback-password` erwarten Nachweis in /complete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, identifier]
              properties:
                method: { type: string, enum: [email, recovery-code, fallback-password] }
                identifier: { type: string, description: Konto-`handle` }
      responses:
        '202': { description: angenommen, content: { application/json: { schema: { type: object, required: [recoveryId], properties: { recoveryId: { type: string } } } } } }
        '429': { $ref: '#/components/responses/TooMany' }
  /api/v1/auth/recovery/complete:
    post:
      operationId: recoveryComplete
      description: |
        Prüft Nachweis (Code bzw. Passwort) atomar und einmalig; eröffnet eine kurzlebige Recovery-Sitzung
        (Cookie tt_session mit Flag recovery=true), die nur das Einrichten eines neuen Passkeys und
        Sitzungswiderruf erlaubt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recoveryId, proof]
              properties:
                recoveryId: { type: string }
                proof: { type: string }
      responses:
        '200': { description: Recovery-Sitzung, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooMany' }
  /api/v1/me/sessions:
    delete:
      operationId: revokeOtherSessions
      description: Widerruft alle anderen Sitzungen des Kontos.
      security: [ { session: [], csrf: [] } ]
      responses: { '204': { description: widerrufen } }
  /api/v1/admin/invitations:
    get:
      operationId: listInvitations
      security: [ { session: [] } ]
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Invitation' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createInvitation
      description: Erzeugt eine Einladung; Klartext-Token nur in dieser Antwort (Server speichert nur den Hash).
      security: [ { session: [], csrf: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresInHours: { type: integer, minimum: 1, maximum: 720, default: 72 }
                note: { type: string, maxLength: 200 }
      responses:
        '201': { description: erzeugt, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationCreated' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/invitations/{id}:
    delete:
      operationId: revokeInvitation
      security: [ { session: [], csrf: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { '204': { description: widerrufen }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/work-models:
    get:
      operationId: listWorkModels
      description: Alle Arbeitsmodell-Versionen des Kontos, nach validFrom sortiert.
      security: [ { session: [] } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/WorkModel' } } } } } }
    post:
      operationId: createWorkModel
      description: Legt eine neue Modellversion an. Eine laufende Vorversion wird am Vortag von validFrom beendet; Vergangenheit wird nie verändert (409 model_overlap bei Überschneidung mit späteren Versionen).
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkModelInput' } } } }
      responses: { '201': { description: angelegt, content: { application/json: { schema: { $ref: '#/components/schemas/WorkModel' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/work-models/{id}:
    get:
      operationId: getWorkModel
      security: [ { session: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/WorkModel' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      operationId: endWorkModel
      description: Setzt nur validTo (z. B. Ausbildungsende). Weitere Felder sind unveränderlich; neue Regeln = neue Version.
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [validTo], properties: { validTo: { type: string, format: date } } } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/WorkModel' } } } }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/places:
    get:
      operationId: listPlaces
      security: [ { session: [] } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Place' } } } } } }
    post:
      operationId: createPlace
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlaceInput' } } } }
      responses: { '201': { description: angelegt, content: { application/json: { schema: { $ref: '#/components/schemas/Place' } } } } }
  /api/v1/places/{id}:
    put:
      operationId: updatePlace
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlaceInput' } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Place' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      operationId: archivePlace
      description: Archiviert den Ort (bestehende Segmente behalten ihre Referenz).
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: archiviert }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/time/segments:
    get:
      operationId: listSegments
      description: Segmente, deren Beginn in [from, to) (UTC-Instants) liegt; Rohzeiten und Revisionsanzahl enthalten, stornierte nur mit includeVoided.
      security: [ { session: [] } ]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: includeVoided, in: query, schema: { type: boolean, default: false } }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Segment' } } } } } }
    post:
      operationId: createSegment
      description: Manueller Eintrag (abgeschlossen oder, ohne endedAt, laufend). Überschneidung mit anderem Segment → 409 segment_overlap.
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SegmentInput' } } } }
      responses: { '201': { description: angelegt, content: { application/json: { schema: { $ref: '#/components/schemas/Segment' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/time/segments/{id}:
    get:
      operationId: getSegment
      security: [ { session: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Segment' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      operationId: correctSegment
      description: Korrektur mit Pflichtgrund; If-Match muss die aktuelle version enthalten (sonst 412 stale_version). Rohzeiten bleiben erhalten, es entsteht eine Revision.
      security: [ { session: [], csrf: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SegmentCorrection' } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Segment' } } } }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '412': { description: veraltete Version, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
    delete:
      operationId: voidSegment
      description: Storniert das Segment (Soft-Delete mit Grund im Query `reason`); Rohdaten bleiben.
      security: [ { session: [], csrf: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: reason, in: query, required: true, schema: { type: string, maxLength: 200 } }
      responses: { '204': { description: storniert }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/time/timer:
    get:
      operationId: currentTimer
      security: [ { session: [] } ]
      responses: { '200': { description: laufendes Segment oder null, content: { application/json: { schema: { oneOf: [ { $ref: '#/components/schemas/Segment' }, { type: 'null' } ] } } } } }
  /api/v1/time/timer/start:
    post:
      operationId: startTimer
      description: Idempotent über clientEventId. Läuft bereits ein anderes Segment → 409 timer_already_running.
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [clientEventId], properties: { clientEventId: { type: string, format: uuid }, kind: { $ref: '#/components/schemas/SegmentKind' }, placeId: { type: [string, 'null'], format: uuid } } } } } }
      responses: { '200': { description: gestartet oder bereits durch dieses Ereignis gestartet, content: { application/json: { schema: { $ref: '#/components/schemas/Segment' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/time/timer/stop:
    post:
      operationId: stopTimer
      description: Idempotent über clientEventId; ohne laufendes Segment und ohne früheres Ereignis → 409 no_running_timer.
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [clientEventId], properties: { clientEventId: { type: string, format: uuid } } } } } }
      responses: { '200': { description: gestoppt, content: { application/json: { schema: { $ref: '#/components/schemas/Segment' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/time/days:
    get:
      operationId: listDayEvaluations
      description: Bewertungen für lokale Tage von..bis (max. 93 Tage), einschließlich Tagen ohne Segmente (Soll/Markierung).
      security: [ { session: [] } ]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DayEvaluation' } } } } } }
  /api/v1/time/days/{date}:
    get:
      operationId: getDayEvaluation
      security: [ { session: [] } ]
      parameters: [ { name: date, in: path, required: true, schema: { type: string, format: date } } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/DayEvaluation' } } } } }
    put:
      operationId: setDayPreferences
      description: Tagesmarkierung und/oder Überspringen fester Pausen setzen (leere Markierung `none` entfernt sie).
      security: [ { session: [], csrf: [] } ]
      parameters: [ { name: date, in: path, required: true, schema: { type: string, format: date } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { mark: { $ref: '#/components/schemas/DayMarkKind' }, creditSeconds: { type: [integer, 'null'], minimum: 0 }, skipFixedBreaks: { type: boolean }, note: { type: [string, 'null'], maxLength: 200 } } } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/DayEvaluation' } } } } }
  /api/v1/time/account:
    get:
      operationId: getTimeAccount
      description: Zeitkontosaldo bis einschließlich asOf (Standard heute); heutiger Tag ist vorläufig.
      security: [ { session: [] } ]
      parameters: [ { name: asOf, in: query, schema: { type: string, format: date } } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/TimeAccount' } } } } }
  /api/v1/time/account/adjustments:
    post:
      operationId: createAccountAdjustment
      description: Anfangsstand (kind=opening, höchstens einer, setzt accountStart) oder datierte Korrektur.
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [kind, date, seconds, reason], properties: { kind: { type: string, enum: [opening, correction] }, date: { type: string, format: date }, seconds: { type: integer }, reason: { type: string, maxLength: 200 } } } } } }
      responses: { '201': { description: angelegt, content: { application/json: { schema: { $ref: '#/components/schemas/TimeAccount' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/time/suggestions:
    get:
      operationId: listSuggestions
      security: [ { session: [] } ]
      responses: { '200': { description: offene Vorschläge, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Suggestion' } } } } } }
  /api/v1/time/suggestions/{id}/accept:
    post:
      operationId: acceptSuggestion
      description: Erzeugt aus dem Vorschlag ein Segment bzw. beendet das offene (Zeiten optional überschreibbar). Einmalig; zweites Mal → 409.
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { startedAt: { type: string, format: date-time }, endedAt: { type: string, format: date-time } } } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Segment' } } } }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/time/suggestions/{id}/reject:
    post:
      operationId: rejectSuggestion
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: verworfen }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/me/device-tokens:
    get:
      operationId: listDeviceTokens
      security: [ { session: [] } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DeviceToken' } } } } } }
    post:
      operationId: createDeviceToken
      description: Erzeugt ein Gerätetoken (nur Automation-Scope). Klartext nur in dieser Antwort.
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 80 }, expiresInDays: { type: integer, minimum: 1, maximum: 730 } } } } } }
      responses: { '201': { description: erzeugt, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/DeviceToken' }, { type: object, required: [token], properties: { token: { type: string } } } ] } } } } }
  /api/v1/me/device-tokens/{id}:
    delete:
      operationId: revokeDeviceToken
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: widerrufen }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/automation/events:
    post:
      operationId: postAutomationEvent
      description: |
        Für Shortcuts. Auth: `Authorization: Bearer <device token>` (kein Cookie/CSRF). Idempotent über eventId; ein Duplikat liefert das erste Ergebnis.
        Ergebnis je nach Ortsmodus: `booked`, `suggested`, `ignored`, `recorded` (nur festgehalten), `duplicate`, `needs_review`.
      security: [ { deviceToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AutomationEvent' } } } }
      responses:
        '200': { description: verarbeitet, content: { application/json: { schema: { type: object, required: [result], properties: { result: { type: string, enum: [booked, suggested, ignored, recorded, duplicate, needs_review] }, segmentId: { type: [string, 'null'], format: uuid }, suggestionId: { type: [string, 'null'], format: uuid } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/vacation/settings:
    get:
      operationId: getVacationSettings
      security: [ { session: [] } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/VacationSettings' } } } } }
    put:
      operationId: putVacationSettings
      description: Region, Jahresanspruch und Übertragsregel. Standard laut ADR-0005 (Annahme für Onboarding) 30 Tage und Region DE-ST.
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VacationSettings' } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/VacationSettings' } } } } }
  /api/v1/vacation/snapshots:
    post:
      operationId: createVacationSnapshot
      description: Stichtagsbestand (Resturlaub zu einem Datum). Ersetzt die davor liegende Kontohistorie; Verbrauch/Anspruch zählen erst ab dem Stichtag.
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [date, remainingHalfDays], properties: { date: { type: string, format: date }, remainingHalfDays: { type: integer, minimum: 0 } } } } } }
      responses: { '201': { description: angelegt, content: { application/json: { schema: { $ref: '#/components/schemas/VacationBalance' } } } } }
  /api/v1/vacation/adjustments:
    post:
      operationId: createVacationAdjustment
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [date, halfDays, reason], properties: { date: { type: string, format: date }, halfDays: { type: integer }, reason: { type: string, maxLength: 200 } } } } } }
      responses: { '201': { description: angelegt, content: { application/json: { schema: { $ref: '#/components/schemas/VacationBalance' } } } } }
  /api/v1/vacation/balance:
    get:
      operationId: getVacationBalance
      description: Kontostand für ein Urlaubsjahr (Kalenderjahr). available = Anspruch + Übertrag + Korrekturen − gebucht(genehmigt/genommen); geplant/beantragt separat, `availableAfterPlanned` als Vorschau.
      security: [ { session: [] } ]
      parameters: [ { name: year, in: query, required: true, schema: { type: integer } } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/VacationBalance' } } } } }
  /api/v1/absences:
    get:
      operationId: listAbsences
      security: [ { session: [] } ]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Absence' } } } } } }
    post:
      operationId: createAbsence
      description: Urlaub/Krankheit/sonstige Abwesenheit. Überlappung mit anderer Abwesenheit → 409 absence_overlap. Verbrauch in halben Tagen nur an Arbeitstagen des Modells, nicht an Feiertagen.
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AbsenceInput' } } } }
      responses: { '201': { description: angelegt, content: { application/json: { schema: { $ref: '#/components/schemas/Absence' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/absences/{id}:
    put:
      operationId: updateAbsence
      description: Ändert Zeitraum/Status; Statuswechsel zählt Tage nie doppelt (genehmigt→genommen). If-Match auf version.
      security: [ { session: [], csrf: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AbsenceInput' } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Absence' } } } }, '404': { $ref: '#/components/responses/NotFound' }, '412': { description: veraltete Version, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
    delete:
      operationId: deleteAbsence
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: gelöscht }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/calendar/holidays:
    get:
      operationId: listHolidays
      description: Gesetzliche Feiertage der eingestellten Region (fest eingebaut, DE inkl. Bundesländer) plus eigene Einträge; Schulferien nur als vom Nutzer erfasste Zeiträume.
      security: [ { session: [] } ]
      parameters:
        - { name: year, in: query, required: true, schema: { type: integer } }
        - { name: region, in: query, schema: { type: string, description: ISO 3166-2, z. B. DE-ST; Standard aus Einstellungen } }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CalendarDay' } } } } } }
  /api/v1/calendar/custom-days:
    post:
      operationId: createCustomCalendarDay
      description: Eigener Feiertag/Brückentag oder Schulferien-Zeitraum.
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [kind, startDate, endDate, name], properties: { kind: { type: string, enum: [holiday, school_holiday] }, startDate: { type: string, format: date }, endDate: { type: string, format: date }, name: { type: string, maxLength: 80 } } } } } }
      responses: { '201': { description: angelegt, content: { application/json: { schema: { $ref: '#/components/schemas/CalendarDay' } } } } }
  /api/v1/calendar/custom-days/{id}:
    delete:
      operationId: deleteCustomCalendarDay
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: gelöscht }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/plan/days:
    get:
      operationId: listPlanDays
      description: Geplante Arbeitsform je Tag (Büro/HO/Kunde/Schule/frei) für den Zeitraum; Urlaub/Feiertage werden im Kalender zusätzlich abgeleitet geliefert.
      security: [ { session: [] } ]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PlanDay' } } } } } }
  /api/v1/plan/days/{date}:
    put:
      operationId: putPlanDay
      security: [ { session: [], csrf: [] } ]
      parameters: [ { name: date, in: path, required: true, schema: { type: string, format: date } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlanDayInput' } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/PlanDay' } } } } }
    delete:
      operationId: deletePlanDay
      security: [ { session: [], csrf: [] } ]
      parameters: [ { name: date, in: path, required: true, schema: { type: string, format: date } } ]
      responses: { '204': { description: gelöscht } }
  /api/v1/shares:
    get:
      operationId: listShares
      description: Eigene ausgehende Freigaben.
      security: [ { session: [] } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Share' } } } } } }
    post:
      operationId: createShare
      description: Freigabe an ein anderes Konto derselben Instanz (Empfänger per handle), je Umfang plan/actual/vacation getrennt, nur lesend, standardmäßig nichts geteilt. Unbekannter Empfänger → 404 recipient_not_found (Annahme; kleine Instanz).
      security: [ { session: [], csrf: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [recipientHandle, scopes], properties: { recipientHandle: { type: string }, scopes: { $ref: '#/components/schemas/ShareScopes' } } } } } }
      responses: { '201': { description: angelegt, content: { application/json: { schema: { $ref: '#/components/schemas/Share' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/shares/{id}:
    patch:
      operationId: updateShare
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [scopes], properties: { scopes: { $ref: '#/components/schemas/ShareScopes' } } } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Share' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      operationId: revokeShare
      description: Widerruft sofort; neue Abrufe liefern 404.
      security: [ { session: [], csrf: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: widerrufen }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/shares/incoming:
    get:
      operationId: listIncomingShares
      security: [ { session: [] } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/IncomingShare' } } } } } }
  /api/v1/shares/incoming/{shareId}/view:
    get:
      operationId: viewShared
      description: |
        Begrenzte Ansicht für den Empfänger. Je freigegebenem Scope: plan = geplante Arbeitsform je Tag ohne Notizen; actual = nur bewertete Beginn/Ende und Dauer je Tag, keine Orte/Notizen/Segmente;
        vacation = nur als Urlaub erkennbare Abwesenheiten (Zeiträume), niemals Krankheit/Unterlagen/Notizen. Nicht freigegebene Scopes fehlen. Widerrufen/fremd → 404.
      security: [ { session: [] } ]
      parameters:
        - { name: shareId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/SharedView' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: tt_session }
    deviceToken: { type: http, scheme: bearer }
    csrf: { type: apiKey, in: header, name: X-CSRF-Token }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    BadRequest: { description: ungültige Anfrage, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: nicht angemeldet oder Nachweis ungültig, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: keine Berechtigung, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: nicht gefunden (auch bei fremden Objekten), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Konflikt, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    TooMany: { description: zu viele Versuche, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotImplemented: { description: auf diesem Server nicht konfiguriert, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Status:
      type: object
      required: [status]
      properties: { status: { type: string, const: ok } }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: { code: { type: string }, message: { type: string } }
    CreationOptions:
      type: object
      required: [challengeId, publicKey]
      properties:
        challengeId: { type: string }
        publicKey: { type: object, description: PublicKeyCredentialCreationOptionsJSON (W3C) }
    RequestOptions:
      type: object
      required: [challengeId, publicKey]
      properties:
        challengeId: { type: string }
        publicKey: { type: object, description: PublicKeyCredentialRequestOptionsJSON (W3C) }
    RegistrationCredential:
      type: object
      description: RegistrationResponseJSON (W3C), base64url
    AuthenticationCredential:
      type: object
      description: AuthenticationResponseJSON (W3C), base64url
    Passkey:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
    Account:
      type: object
      required: [id, handle, displayName, role]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [admin, member] }
    Session:
      type: object
      required: [account, csrfToken, recovery]
      properties:
        account: { $ref: '#/components/schemas/Account' }
        csrfToken: { type: string }
        recovery: { type: boolean, description: true = eingeschränkte Recovery-Sitzung }
        expiresAt: { type: string, format: date-time }
    RecoveryStatus:
      type: object
      required: [recoveryCodes, fallbackPassword, email]
      properties:
        recoveryCodes: { type: object, required: [active], properties: { active: { type: boolean }, remaining: { type: integer } } }
        fallbackPassword: { type: object, required: [active], properties: { active: { type: boolean } } }
        email: { type: object, required: [available, active], properties: { available: { type: boolean, description: false wenn Server ohne Mailversand }, active: { type: boolean }, verified: { type: boolean } } }
    Invitation:
      type: object
      required: [id, createdAt, expiresAt, status]
      properties:
        id: { type: string, format: uuid }
        note: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        status: { type: string, enum: [open, used, expired, revoked] }
    InvitationCreated:
      allOf:
        - $ref: '#/components/schemas/Invitation'
        - type: object
          required: [token]
          properties: { token: { type: string } }
    SegmentKind: { type: string, enum: [work, travel, school] }
    DayMarkKind: { type: string, enum: [none, holiday, vacation, sick, school_credit] }
    WorkModelInput:
      type: object
      required: [validFrom, weeklyTargetSeconds, workdays]
      properties:
        validFrom: { type: string, format: date }
        validTo: { type: [string, 'null'], format: date }
        timezone: { type: string, default: Europe/Berlin }
        weeklyTargetSeconds: { type: integer, minimum: 0 }
        workdays: { type: array, items: { type: integer, minimum: 1, maximum: 7, description: 1=Montag..7=Sonntag } }
        dailyTargetSeconds: { type: object, additionalProperties: { type: integer, minimum: 0 }, description: optional je Wochentag "1".."7", hat Vorrang }
        travelCountsAsWork: { type: boolean, default: true }
        roundingEnabled: { type: boolean, default: true }
        roundingMinutes: { type: integer, minimum: 1, maximum: 60, default: 15 }
        schoolFullDayThresholdSeconds: { type: integer, minimum: 0, default: 10800 }
        schoolCreditSeconds: { type: [integer, 'null'], description: null = Tages-Soll }
        dayBoundaryMinutes: { type: integer, minimum: 0, maximum: 719, default: 0 }
        fixedBreaks: { type: array, items: { type: object, required: [start, end], properties: { start: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }, end: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' } } } }
    WorkModel:
      allOf:
        - $ref: '#/components/schemas/WorkModelInput'
        - type: object
          required: [id, createdAt]
          properties: { id: { type: string, format: uuid }, createdAt: { type: string, format: date-time } }
    PlaceInput:
      type: object
      required: [name, kind, automationMode]
      properties:
        name: { type: string, maxLength: 80 }
        kind: { type: string, enum: [office, home, customer, school, other] }
        automationMode: { type: string, enum: [direct, suggest, off] }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
        radiusMeters: { type: [integer, 'null'], minimum: 20 }
        confirmAfterSeconds: { type: integer, minimum: 0, default: 300 }
        defaultSegmentKind: { $ref: '#/components/schemas/SegmentKind' }
    Place:
      allOf:
        - $ref: '#/components/schemas/PlaceInput'
        - type: object
          required: [id, archived]
          properties: { id: { type: string, format: uuid }, archived: { type: boolean } }
    SegmentInput:
      type: object
      required: [kind, startedAt]
      properties:
        kind: { $ref: '#/components/schemas/SegmentKind' }
        placeId: { type: [string, 'null'], format: uuid }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        note: { type: [string, 'null'], maxLength: 500 }
    SegmentCorrection:
      type: object
      required: [reason]
      properties:
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        kind: { $ref: '#/components/schemas/SegmentKind' }
        placeId: { type: [string, 'null'], format: uuid }
        note: { type: [string, 'null'], maxLength: 500 }
        reason: { type: string, minLength: 1, maxLength: 200 }
    Segment:
      type: object
      required: [id, kind, startedAt, endedAt, rawStartedAt, rawEndedAt, source, version, voided, needsReview]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/SegmentKind' }
        placeId: { type: [string, 'null'], format: uuid }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        rawStartedAt: { type: string, format: date-time }
        rawEndedAt: { type: [string, 'null'], format: date-time }
        source: { type: string, enum: [timer, manual, automation, suggestion, import] }
        note: { type: [string, 'null'] }
        version: { type: integer }
        voided: { type: boolean }
        needsReview: { type: boolean }
        revisions: { type: integer, description: Anzahl Korrekturen }
    DayEvaluation:
      type: object
      required: [date, targetSeconds, rawWorkSeconds, breakDeductionSeconds, startAdjustSeconds, endAdjustSeconds, evaluatedWorkSeconds, creditSeconds, deltaSeconds, provisional, segmentIds, breakHints]
      properties:
        date: { type: string, format: date }
        modelId: { type: [string, 'null'], format: uuid }
        mark: { $ref: '#/components/schemas/DayMarkKind' }
        skipFixedBreaks: { type: boolean }
        targetSeconds: { type: integer }
        rawWorkSeconds: { type: integer }
        breakDeductionSeconds: { type: integer }
        startAdjustSeconds: { type: integer }
        endAdjustSeconds: { type: integer }
        evaluatedWorkSeconds: { type: integer }
        creditSeconds: { type: integer, description: Schulregel/Markierungsgutschrift anstelle der Segmentsumme }
        deltaSeconds: { type: integer, description: evaluated(+credit) - target }
        evaluatedStart: { type: [string, 'null'], format: date-time }
        evaluatedEnd: { type: [string, 'null'], format: date-time }
        provisional: { type: boolean }
        segmentIds: { type: array, items: { type: string, format: uuid } }
        segments: { type: array, items: { $ref: '#/components/schemas/Segment' }, description: Segmente dieses Arbeitstags (Zuordnung nach ADR-0004; ohne stornierte) }
        markCreditSeconds: { type: [integer, 'null'], description: gesetzte Gutschrift der Markierung }
        note: { type: [string, 'null'] }
        breakHints: { type: array, items: { type: object, required: [code], properties: { code: { type: string, enum: [break_missing_30, break_missing_45, break_part_too_short, work_over_6h_without_break] } } } }
    TimeAccount:
      type: object
      required: [asOf, balanceSeconds, openingSeconds, adjustmentSeconds, provisional]
      properties:
        asOf: { type: string, format: date }
        accountStart: { type: [string, 'null'], format: date }
        balanceSeconds: { type: integer }
        openingSeconds: { type: integer }
        adjustmentSeconds: { type: integer }
        provisional: { type: boolean }
    Suggestion:
      type: object
      required: [id, type, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [start, end] }
        placeId: { type: [string, 'null'], format: uuid }
        proposedStartedAt: { type: [string, 'null'], format: date-time }
        proposedEndedAt: { type: [string, 'null'], format: date-time }
        segmentId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
    DeviceToken:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scope: { type: string, const: automation }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
    AutomationEvent:
      type: object
      required: [eventId, deviceId, type, occurredAt, placeId]
      properties:
        eventId: { type: string, format: uuid }
        deviceId: { type: string, maxLength: 80 }
        type: { type: string, enum: [arrival, presence_confirmed, departure, cancel] }
        placeId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
    VacationSettings:
      type: object
      required: [region, annualEntitlementHalfDays]
      properties:
        region: { type: string, default: DE-ST }
        annualEntitlementHalfDays: { type: integer, minimum: 0, default: 60, description: 30 Tage = 60 halbe Tage (ADR-0005) }
        carryOverHalfDays: { type: integer, minimum: 0, default: 0, description: Übertrag aus dem Vorjahr, sofern kein Stichtagsbestand gilt }
        carryOverExpiry: { type: [string, 'null'], description: Verfall als MM-DD (z. B. 03-31) oder null }
    VacationBalance:
      type: object
      required: [year, entitlementHalfDays, carryOverHalfDays, adjustmentHalfDays, bookedHalfDays, plannedHalfDays, availableHalfDays, availableAfterPlannedHalfDays]
      properties:
        year: { type: integer }
        snapshotDate: { type: [string, 'null'], format: date }
        entitlementHalfDays: { type: integer }
        carryOverHalfDays: { type: integer }
        adjustmentHalfDays: { type: integer }
        bookedHalfDays: { type: integer, description: Status approved oder taken }
        plannedHalfDays: { type: integer, description: Status planned oder requested }
        availableHalfDays: { type: integer }
        availableAfterPlannedHalfDays: { type: integer }
    AbsenceInput:
      type: object
      required: [kind, startDate, endDate, status]
      properties:
        kind: { type: string, enum: [vacation, sick, other] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        halfDayStart: { type: boolean, default: false, description: erster Tag nur halber Tag }
        halfDayEnd: { type: boolean, default: false, description: letzter Tag nur halber Tag }
        status: { type: string, enum: [planned, requested, approved, rejected, cancelled, taken] }
        note: { type: [string, 'null'], maxLength: 500 }
        documentStatus: { type: string, enum: [not_needed, pending, submitted], default: not_needed }
        documentSubmittedOn: { type: [string, 'null'], format: date }
        documentReferenceStart: { type: [string, 'null'], format: date }
        documentReferenceEnd: { type: [string, 'null'], format: date }
    Absence:
      allOf:
        - $ref: '#/components/schemas/AbsenceInput'
        - type: object
          required: [id, version, countedHalfDays]
          properties: { id: { type: string, format: uuid }, version: { type: integer }, countedHalfDays: { type: integer, description: berechneter Verbrauch (nur Arbeitstage, ohne Feiertage) } }
    CalendarDay:
      type: object
      required: [startDate, endDate, name, kind, source]
      properties:
        id: { type: [string, 'null'], format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        name: { type: string }
        kind: { type: string, enum: [holiday, school_holiday] }
        source: { type: string, enum: [builtin, custom] }
    PlanDayInput:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [office, home, customer, school, off] }
        placeId: { type: [string, 'null'], format: uuid }
        note: { type: [string, 'null'], maxLength: 200 }
    PlanDay:
      allOf:
        - $ref: '#/components/schemas/PlanDayInput'
        - type: object
          required: [date]
          properties: { date: { type: string, format: date } }
    ShareScopes:
      type: object
      properties:
        plan: { type: boolean, default: false }
        actual: { type: boolean, default: false }
        vacation: { type: boolean, default: false }
    Share:
      type: object
      required: [id, recipientHandle, scopes, createdAt]
      properties:
        id: { type: string, format: uuid }
        recipientHandle: { type: string }
        scopes: { $ref: '#/components/schemas/ShareScopes' }
        createdAt: { type: string, format: date-time }
    IncomingShare:
      type: object
      required: [id, ownerDisplayName, scopes]
      properties:
        id: { type: string, format: uuid }
        ownerDisplayName: { type: string }
        scopes: { $ref: '#/components/schemas/ShareScopes' }
    SharedView:
      type: object
      properties:
        plan: { type: array, items: { type: object, required: [date, mode], properties: { date: { type: string, format: date }, mode: { type: string, enum: [office, home, customer, school, off] } } } }
        actual: { type: array, items: { type: object, required: [date, evaluatedWorkSeconds], properties: { date: { type: string, format: date }, evaluatedStart: { type: [string, 'null'], format: date-time }, evaluatedEnd: { type: [string, 'null'], format: date-time }, evaluatedWorkSeconds: { type: integer } } } }
        vacation: { type: array, items: { type: object, required: [startDate, endDate], properties: { startDate: { type: string, format: date }, endDate: { type: string, format: date } } } }
