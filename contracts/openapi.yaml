        durationSeconds: { type: integer, minimum: 0, maximum: 86400, default: 0 }
        notes: { type: string, maxLength: 4000, default: '' }
    ReportEntry:
      allOf:
        - $ref: '#/components/schemas/ReportEntryInput'
